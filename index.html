<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dumbbell Workout Timer - Dataset Edition</title>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 { font-size: 20px; font-weight: 700; }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view { display: flex; flex-direction: column; flex: 1; justify-content: space-between; }

    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 280px;
      height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .anatomy-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    .exercise-title { font-size: 24px; font-weight: 700; margin-top: 16px; text-align: center; }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }
    .time-left { font-size: 76px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .rounds-count { font-size: 14px; color: var(--subtext-color); margin-top: 6px; text-transform: uppercase; }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }

    .manager-content { padding: 20px; flex: 1; overflow-y: auto; }

    .search-box {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .search-results {
      max-height: 180px;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .search-item {
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background-color: var(--card-inner); }

    .ex-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .icon-btn { background: none; border: none; color: var(--subtext-color); font-size: 18px; padding: 6px; cursor: pointer; }
    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Workout Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Search Dataset</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <img id="exerciseArt" src="" alt="Exercise Frame">
      </div>
      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Biceps Curl</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <h3>Search Dataset Exercises</h3>
      <br>
      <input type="text" id="searchInput" class="search-box" placeholder="Type exercise name (e.g. Curl, Bench, Squat)..." oninput="filterDataset()">
      
      <div class="search-results" id="searchResults"></div>

      <h3>Your Active Routine</h3>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    const RAW_BASE = "https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/exercises/";

    // Popular exercise presets mapped to GitHub directory folder names
    const dataset = [
      { name: "Biceps Curl", path: "Biceps_Curl" },
      { name: "Barbell Bench Press", path: "Barbell_Bench_Press" },
      { name: "Dumbbell Shoulder Press", path: "Dumbbell_Shoulder_Press" },
      { name: "Tricep Dumbbell Extension", path: "Tricep_Dumbbell_Extension" },
      { name: "Lat Pulldown", path: "Lat_Pulldown" },
      { name: "Bent Over Row", path: "Bent_Over_Row" },
      { name: "Bodyweight Squat", path: "Bodyweight_Squat" },
      { name: "Dumbbell Lunge", path: "Dumbbell_Lunge" },
      { name: "Push Up", path: "Push_Up" }
    ];

    let exercises = [
      { name: "Biceps Curl", path: "Biceps_Curl" },
      { name: "Barbell Bench Press", path: "Barbell_Bench_Press" }
    ];

    let currentExerciseIndex = 0;
    let isWorkPhase = true;
    let isRunning = false;
    let timeRemaining = 30;
    let timerInterval = null;
    let animationInterval = null;
    let isFrameOne = false;

    function getImageUrl(folderPath, frame) {
      return `${RAW_BASE}${folderPath}/images/${frame}.png`;
    }

    function startAnimation() {
      stopAnimation();
      animationInterval = setInterval(() => {
        if (isRunning && isWorkPhase) {
          isFrameOne = !isFrameOne;
        } else {
          isFrameOne = false;
        }
        updateArtDisplay();
      }, 1000);
    }

    function stopAnimation() {
      if (animationInterval) clearInterval(animationInterval);
    }

    function updateArtDisplay() {
      const artImg = document.getElementById('exerciseArt');
      const currentEx = exercises[currentExerciseIndex] || dataset[0];
      const frame = isFrameOne ? 1 : 0;
      artImg.src = getImageUrl(currentEx.path, frame);
    }

    function filterDataset() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!query) return;

      const filtered = dataset.filter(ex => ex.name.toLowerCase().includes(query));
      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `<span>${ex.name}</span><button class="nav-btn">+ Add</button>`;
        item.onclick = () => addFromDataset(ex);
        resultsContainer.appendChild(item);
      });
    }

    function addFromDataset(ex) {
      exercises.push(ex);
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
      renderManagerList();
    }

    function toggleView() {
      const timerView = document.getElementById('timerView');
      const managerView = document.getElementById('managerView');
      const toggleBtn = document.getElementById('toggleViewBtn');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Search Dataset";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (exercises.length === 0) return alert("Please add an exercise first.");
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');

      startAnimation();
      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining < 0) switchPhase();
        else updateDisplay();
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      updateDisplay();
    }

    function switchPhase() {
      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = 10;
      } else {
        isWorkPhase = true;
        currentExerciseIndex = (currentExerciseIndex + 1) % exercises.length;
        timeRemaining = 30;
      }
      isFrameOne = false;
      updateDisplay();
    }

    function updateDisplay() {
      const currentEx = exercises[currentExerciseIndex] || dataset[0];
      const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
      const secs = String(timeRemaining % 60).padStart(2, '0');
      
      document.getElementById('timer').innerText = `${mins}:${secs}`;
      document.getElementById('roundDisplay').innerText = `Exercise ${currentExerciseIndex + 1} of ${exercises.length}`;

      const phaseBadge = document.getElementById('phaseBadge');
      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work";
        document.getElementById('exerciseName').innerText = currentEx.name;
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest";
        document.getElementById('exerciseName').innerText = "Rest Phase";
      }
      updateArtDisplay();
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      stopAnimation();
      isRunning = false;
      isWorkPhase = true;
      isFrameOne = false;
      currentExerciseIndex = 0;
      timeRemaining = 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');

      updateDisplay();
    }

    function renderManagerList() {
      const listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';
      exercises.forEach((ex, idx) => {
        const li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = `<span>${ex.name}</span><button class="icon-btn delete" onclick="deleteEx(${idx})">✕</button>`;
        listEl.appendChild(li);
      });
    }

    function deleteEx(idx) {
      exercises.splice(idx, 1);
      renderManagerList();
    }

    resetWorkout();
  </script>
</body>
</html>
