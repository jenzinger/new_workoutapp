<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jens' Muscle Maker</title>

  <!-- Google Font for Fancy Title (Teko) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Matching dark tone #121212 across all elements */
      --bg-color: #121212;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: transparent;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background-color: var(--bg-color);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .brand-header-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 16px 12px;
      background-color: var(--bg-color);
    }

    /* Logo Image Container matching #121212 */
    .app-logo-img {
      width: 160px;
      height: auto;
      object-fit: contain;
      margin-bottom: 8px;
      background-color: #121212;
      mix-blend-mode: lighten;
    }

    /* Title Split Into One Word Per Line */
    .fancy-title {
      font-family: 'Teko', sans-serif;
      font-size: 42px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 0.85;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 4px 12px rgba(255, 255, 255, 0.15));
    }

    .fancy-title span {
      display: block;
    }

    .view { display: flex; flex-direction: column; flex: 1; justify-content: space-between; }

    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      flex: 1;
    }

    .phase-indicator {
      font-size: 40px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-align: center;
    }

    .phase-indicator.work { color: var(--accent-work); }
    .phase-indicator.rest { color: var(--accent-rest); }

    .anatomy-card {
      width: 100%;
      max-width: 340px;
      height: 210px;
      background-color: #ffffff;
      border: none;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .anatomy-card img, .anatomy-card video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }

    .exercise-title {
      font-size: 19px;
      font-weight: 700;
      margin-top: 12px;
      text-align: center;
    }

    .timer-display { text-align: center; margin: 4px 0 12px; }
    .time-left { font-size: 72px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .rounds-count { font-size: 13px; color: var(--subtext-color); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    .controls-card {
      background-color: var(--card-bg);
      border: none;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 16px 24px 28px;
    }

    .btn-group { display: flex; gap: 12px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: none; }

    .manager-content { padding: 16px; flex: 1; overflow-y: auto; }

    .settings-panel {
      background: var(--card-bg);
      border: none;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-row label {
      font-size: 14px;
      color: var(--text-color);
      font-weight: 600;
    }

    .setting-row input {
      width: 90px;
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }

    .search-box {
      width: 100%;
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .search-results {
      max-height: 180px;
      overflow-y: auto;
      background: var(--card-bg);
      border: none;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background-color: var(--card-inner); }

    .ex-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

    .ex-item {
      background-color: var(--card-bg);
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ex-thumb {
      width: 44px;
      height: 44px;
      background-color: #ffffff;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
      padding: 2px;
    }

    .ex-info {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
    }

    .ex-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn { background: none; border: none; color: var(--subtext-color); font-size: 16px; padding: 6px; cursor: pointer; }
    .icon-btn:hover { color: var(--text-color); }
    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Settings & Dataset</button>
  </header>

  <div class="brand-header-container">
    <img src="./muscle-logo.png" alt="Muscle Logo" class="app-logo-img">
    
    <h1 class="fancy-title">
      <span>JENS'</span>
      <span>MUSCLE</span>
      <span>MAKER</span>
    </h1>
  </div>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div id="phaseIndicator" class="phase-indicator work">GO!</div>
      
      <div class="anatomy-card" id="mediaContainer">
        <img id="exerciseArt" src="" alt="Exercise Animation">
      </div>
      
      <div class="exercise-title" id="exerciseName">Standing Inner Biceps Curl</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 7 • Cycle 1 of 1</div>
    </div>

    <div class="controls-card">
      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <h3>Timer Settings</h3>
      <div class="settings-panel">
        <div class="setting-row">
          <label for="workInput">Work Duration (s)</label>
          <input type="number" id="workInput" value="30" min="5" onchange="updateSettings()">
        </div>
        <div class="setting-row">
          <label for="restInput">Rest Duration (s)</label>
          <input type="number" id="restInput" value="10" min="0" onchange="updateSettings()">
        </div>
        <div class="setting-row">
          <label for="cyclesInput">Total Cycles</label>
          <input type="number" id="cyclesInput" value="1" min="1" onchange="updateSettings()">
        </div>
      </div>

      <h3>Search Dataset Exercises</h3>
      <input type="text" id="searchInput" class="search-box" placeholder="Type exercise name..." oninput="filterDataset()">
      
      <div class="search-results" id="searchResults"></div>

      <h3>Your Active Routine</h3>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    const dataset = [
      { name: "Standing Inner Biceps Curl", src: "./GIFs/Standing-Inner-Biceps-Curl.gif" },
      { name: "Bent-Over Row", src: "./GIFs/Bent-Over-Row.gif" },
      { name: "Chest Press", src: "./GIFs/Chest-Press.gif" },
      { name: "Overhead Press", src: "./GIFs/Overhead-Press.gif" },
      { name: "Skull Crusher", src: "./GIFs/Skull-Crusher.gif" },
      { name: "Glute Bridge", src: "./GIFs/Glute-Bridge.gif" },
      { name: "Crunches", src: "./GIFs/Crunshes.gif" }
    ];

    let exercises = [...dataset];

    let currentExerciseIndex = 0;
    let currentCycle = 1;
    let totalCycles = 1;
    let workDuration = 30;
    let restDuration = 10;

    let isWorkPhase = true;
    let isRunning = false;
    let timeRemaining = workDuration;
    let timerInterval = null;
    let activeMediaSrc = "";

    function updateSettings() {
      workDuration = parseInt(document.getElementById('workInput').value) || 30;
      restDuration = parseInt(document.getElementById('restInput').value) || 10;
      totalCycles = parseInt(document.getElementById('cyclesInput').value) || 1;
      resetWorkout();
    }

    function getNextExercise() {
      if (currentExerciseIndex + 1 < exercises.length) {
        return exercises[currentExerciseIndex + 1];
      } else if (currentCycle < totalCycles) {
        return exercises[0];
      }
      return null;
    }

    function updateArtDisplay() {
      const container = document.getElementById('mediaContainer');
      const targetEx = isWorkPhase 
        ? (exercises[currentExerciseIndex] || dataset[0]) 
        : getNextExercise();

      if (!targetEx) {
        container.innerHTML = `<div style="color: #8e8e93; font-weight: 600;">Workout Complete</div>`;
        document.getElementById('exerciseName').innerText = "All Exercises Completed";
        activeMediaSrc = "";
        return;
      }

      const cacheBustSrc = targetEx.src.endsWith('.gif') 
        ? `${targetEx.src}?t=${Date.now()}` 
        : targetEx.src;

      if (activeMediaSrc !== targetEx.src) {
        activeMediaSrc = targetEx.src;
        const isVideo = targetEx.src.endsWith('.mp4');

        if (isVideo) {
          container.innerHTML = `<video src="${targetEx.src}" autoplay loop muted playsinline></video>`;
        } else {
          container.innerHTML = `<img id="exerciseArt" src="${cacheBustSrc}" alt="${targetEx.name}">`;
        }
      }

      document.getElementById('exerciseName').innerText = targetEx.name;
    }

    function filterDataset() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!query) return;

      const filtered = dataset.filter(ex => ex.name.toLowerCase().includes(query));
      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'search-item';
        const thumbHTML = ex.src.endsWith('.mp4') 
          ? `<video class="ex-thumb" src="${ex.src}" autoplay loop muted playsinline></video>`
          : `<img class="ex-thumb" src="${ex.src}" alt="${ex.name}">`;
          
        item.innerHTML = `
          ${thumbHTML}
          <span style="flex:1;">${ex.name}</span>
          <button class="nav-btn">+ Add</button>
        `;
        item.onclick = () => addFromDataset(ex);
        resultsContainer.appendChild(item);
      });
    }

    function addFromDataset(ex) {
      exercises.push(ex);
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
      renderManagerList();
      updateDisplay();
    }

    function toggleView() {
      const timerView = document.getElementById('timerView');
      const managerView = document.getElementById('managerView');
      const toggleBtn = document.getElementById('toggleViewBtn');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Settings & Dataset";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (exercises.length === 0) return alert("Please add an exercise first.");
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');

      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining < 0) switchPhase();
        else updateDisplay();
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      updateDisplay();
    }

    function switchPhase() {
      activeMediaSrc = "";
      if (isWorkPhase) {
        if (restDuration > 0) {
          isWorkPhase = false;
          timeRemaining = restDuration;
        } else {
          advanceExercise();
        }
      } else {
        isWorkPhase = true;
        advanceExercise();
      }
      updateDisplay();
    }

    function advanceExercise() {
      if (currentExerciseIndex + 1 < exercises.length) {
        currentExerciseIndex++;
        timeRemaining = workDuration;
      } else {
        if (currentCycle < totalCycles) {
          currentCycle++;
          currentExerciseIndex = 0;
          timeRemaining = workDuration;
        } else {
          alert("Workout Completed!");
          resetWorkout();
        }
      }
    }

    function updateDisplay() {
      const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
      const secs = String(timeRemaining % 60).padStart(2, '0');
      
      document.getElementById('timer').innerText = `${mins}:${secs}`;
      document.getElementById('roundDisplay').innerText = `Exercise ${exercises.length > 0 ? currentExerciseIndex + 1 : 0} of ${exercises.length} • Cycle ${currentCycle} of ${totalCycles}`;

      const phaseIndicator = document.getElementById('phaseIndicator');
      if (isWorkPhase) {
        phaseIndicator.className = "phase-indicator work";
        phaseIndicator.innerText = "GO!";
      } else {
        phaseIndicator.className = "phase-indicator rest";
        phaseIndicator.innerText = "REST!";
      }

      updateArtDisplay();
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      currentCycle = 1;
      timeRemaining = workDuration;
      activeMediaSrc = "";

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');

      updateDisplay();
    }

    function renderManagerList() {
      const listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';
      exercises.forEach((ex, idx) => {
        const li = document.createElement('li');
        li.className = 'ex-item';
        const thumbHTML = ex.src.endsWith('.mp4') 
          ? `<video class="ex-thumb" src="${ex.src}" autoplay loop muted playsinline></video>`
          : `<img class="ex-thumb" src="${ex.src}" alt="${ex.name}">`;

        li.innerHTML = `
          ${thumbHTML}
          <div class="ex-info">${ex.name}</div>
          <div class="ex-actions">
            <button class="icon-btn" onclick="moveEx(${idx}, -1)">▲</button>
            <button class="icon-btn" onclick="moveEx(${idx}, 1)">▼</button>
            <button class="icon-btn delete" onclick="deleteEx(${idx})">✕</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function moveEx(idx, direction) {
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= exercises.length) return;
      const temp = exercises[idx];
      exercises[idx] = exercises[targetIdx];
      exercises[targetIdx] = temp;
      renderManagerList();
      resetWorkout();
    }

    function deleteEx(idx) {
      exercises.splice(idx, 1);
      if (currentExerciseIndex >= exercises.length) {
        currentExerciseIndex = Math.max(0, exercises.length - 1);
      }
      renderManagerList();
      resetWorkout();
    }

    resetWorkout();
  </script>
</body>
</html>
