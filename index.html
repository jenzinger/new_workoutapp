<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout Manager Pro</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --card-inner: #2c2c2e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --muscle-active: #ff3b30;
      --muscle-base: #48484a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid #2c2c2e;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 220px;
      height: 220px;
      background-color: var(--card-bg);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .body-outline { fill: var(--card-inner); stroke: #3a3a3c; stroke-width: 1.5; }
    .muscle { fill: var(--muscle-base); transition: fill 0.3s ease; }
    .muscle.active { fill: var(--muscle-active); filter: drop-shadow(0 0 6px var(--muscle-active)); }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 14px;
      text-align: center;
    }

    .muscle-label {
      font-size: 13px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.2); color: var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.2); color: var(--accent-rest); }

    .timer-display {
      text-align: center;
      margin: 8px 0;
    }

    .time-left {
      font-size: 72px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .rounds-count {
      font-size: 15px;
      color: var(--subtext-color);
      margin-top: 6px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label {
      font-size: 15px;
      color: var(--subtext-color);
    }

    .setting-row input {
      width: 65px;
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 10px 16px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info {
      display: flex;
      flex-direction: column;
    }

    .ex-name {
      font-size: 16px;
      font-weight: 600;
    }

    .ex-target {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .ex-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Workout Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <svg width="150" height="190" viewBox="0 0 100 130">
          <path class="body-outline" d="M 50 10 C 53 10 56 12 56 16 C 56 20 53 22 50 22 C 47 22 44 20 44 16 C 44 12 47 10 50 10 Z M 42 24 L 58 24 L 66 32 L 62 60 L 58 60 L 57 85 L 53 120 L 47 120 L 43 85 L 42 60 L 38 60 L 34 32 Z" />
          <path id="m-chest" class="muscle" d="M 43 30 Q 50 32 50 38 Q 43 38 43 30 Z M 57 30 Q 50 32 50 38 Q 57 38 57 30 Z" />
          <path id="m-abs" class="muscle" d="M 45 40 L 55 40 L 54 58 L 46 58 Z" />
          <path id="m-legs" class="muscle" d="M 43 62 L 49 62 L 48 90 L 43 90 Z M 57 62 L 51 62 L 52 90 L 57 90 Z" />
          <path id="m-arms" class="muscle" d="M 37 34 L 41 34 L 40 48 L 36 48 Z M 63 34 L 59 34 L 60 48 L 64 48 Z" />
          <path id="m-shoulders" class="muscle" d="M 36 26 L 42 26 L 41 33 L 35 32 Z M 64 26 L 58 26 L 59 33 L 65 32 Z" />
          <path id="m-back" class="muscle" d="M 43 28 L 57 28 L 55 45 L 45 45 Z" />
        </svg>
      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Jumping Jacks</div>
      <div class="muscle-label" id="muscleLabel">Target: LEGS</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add New Exercise</h3>
        <input type="text" id="newExName" placeholder="Exercise Name (e.g. Push-ups)">
        <select id="newExMuscle">
          <option value="chest">Chest</option>
          <option value="abs">Core / Abs</option>
          <option value="legs">Legs / Quads</option>
          <option value="arms">Arms / Biceps</option>
          <option value="shoulders">Shoulders</option>
          <option value="back">Back</option>
        </select>
        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    var defaultExercises = [
      { id: 1, name: "Jumping Jacks", muscle: "legs" },
      { id: 2, name: "Push-ups", muscle: "chest" },
      { id: 3, name: "Crunches", muscle: "abs" },
      { id: 4, name: "Squats", muscle: "legs" }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_workout_exercises');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;

    function saveExercises() {
      try {
        localStorage.setItem('ios_workout_exercises', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Workout Timer";
        resetWorkout();
      }
    }

    function highlightMuscle(targetMuscle) {
      var allMuscles = document.querySelectorAll('.muscle');
      for (var i = 0; i < allMuscles.length; i++) {
        allMuscles[i].classList.remove('active');
      }
      var activeElement = document.getElementById('m-' + targetMuscle);
      if (activeElement) {
        activeElement.classList.add('active');
      }
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || { name: "None", muscle: "none" };
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Exercise";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "GENERAL");
        highlightMuscle(currentEx.muscle);
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Pause / Rest";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");
        highlightMuscle('none');
      }
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var muscleSelect = document.getElementById('newExMuscle');
      var name = nameInput.value.trim();

      if (!name) return;

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: muscleSelect.value
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Run initial load
    resetWorkout();
  </script>
</body>
</html>
