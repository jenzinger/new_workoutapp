<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dumbbell Workout Timer</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dumbbell Timer">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 260px;
      height: 260px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .anatomy-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
      transition: opacity 0.3s ease;
    }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 16px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .muscle-label {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }

    .time-left {
      font-size: 76px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -2px;
    }

    .rounds-count {
      font-size: 14px;
      color: var(--subtext-color);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label { font-size: 15px; color: var(--subtext-color); }

    .setting-row input {
      width: 70px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 12px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info { display: flex; flex-direction: column; }
    .ex-name { font-size: 16px; font-weight: 600; }
    .ex-target { font-size: 11px; color: var(--subtext-color); text-transform: uppercase; margin-top: 2px; letter-spacing: 0.5px; }
    .ex-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Dumbbell Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <!-- Self-Contained Vector Render -->
        <img id="exerciseArt" src="" alt="Exercise Anatomy Render">
      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Dumbbell Curls</div>
      <div class="muscle-label" id="muscleLabel">Target: BICEPS</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add Dumbbell Exercise</h3>
        
        <input type="text" id="newExName" list="exercisePresets" placeholder="Type or select exercise" oninput="autoDetectConfig()">
        
        <datalist id="exercisePresets">
          <option value="Dumbbell Curls">
          <option value="Hammer Curls">
          <option value="Tricep Extensions">
          <option value="Tricep Kickbacks">
          <option value="Dumbbell Bench Press">
          <option value="Chest Flyes">
          <option value="Single-Arm Rows">
          <option value="Bent-Over Rows">
        </datalist>

        <select id="newExMuscle">
          <option value="biceps">Biceps (Arms)</option>
          <option value="triceps">Triceps (Arms)</option>
          <option value="chest">Chest (Pectorals)</option>
          <option value="back">Back (Lats &amp; Traps)</option>
        </select>

        <select id="newExArt">
          <option value="biceps">Bicep Muscle Map</option>
          <option value="triceps">Triceps Muscle Map</option>
          <option value="chest">Chest Muscle Map</option>
          <option value="back">Back Muscle Map</option>
        </select>

        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    /* PERMANENT OFFLINE EMBEDDED GRAPHICS (Zero Network Dependencies - ~15KB total) */
    var renderAssets = {
      biceps: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><rect x="80" y="160" width="40" height="6" rx="3" fill="%232c2c2e"/><circle cx="100" cy="45" r="16" fill="%233a3a3c"/><path d="M84 62 C76 70 76 95 80 135 L120 135 C124 95 124 70 116 62 Z" fill="%233a3a3c"/><path d="M76 66 C66 78 62 102 66 130 L54 130 C48 102 56 74 68 62 Z" fill="%232c2c2e"/><path d="M124 66 C134 78 138 102 134 130 L146 130 C152 102 144 74 132 62 Z" fill="%232c2c2e"/><path d="M68 82 C64 90 64 106 70 114 C74 106 74 90 68 82 Z" fill="%2330d158"/><path d="M132 82 C136 90 136 106 130 114 C126 106 126 90 132 82 Z" fill="%2330d158"/><rect x="46" y="126" width="16" height="28" rx="5" fill="%238e8e93"/><rect x="138" y="126" width="16" height="28" rx="5" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><rect x="80" y="160" width="40" height="6" rx="3" fill="%232c2c2e"/><circle cx="100" cy="45" r="16" fill="%233a3a3c"/><path d="M84 62 C76 70 76 95 80 135 L120 135 C124 95 124 70 116 62 Z" fill="%233a3a3c"/><path d="M76 66 C64 74 56 82 52 94 L62 102 C70 86 76 78 80 74 Z" fill="%232c2c2e"/><path d="M124 66 C136 74 144 82 148 94 L138 102 C130 86 124 78 120 74 Z" fill="%232c2c2e"/><path d="M70 74 C62 80 60 90 68 96 C74 88 74 78 70 74 Z" fill="%2330d158"/><path d="M130 74 C138 80 140 90 132 96 C126 88 126 78 130 74 Z" fill="%2330d158"/><rect x="44" y="86" width="20" height="20" rx="6" fill="%238e8e93"/><rect x="136" y="86" width="20" height="20" rx="6" fill="%238e8e93"/></svg>'
      },
      triceps: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><circle cx="100" cy="80" r="16" fill="%233a3a3c"/><path d="M84 100 L80 170 L120 170 L116 100 Z" fill="%233a3a3c"/><path d="M84 100 C80 72 84 52 86 36 L98 36 C94 52 92 72 90 100 Z" fill="%232c2c2e"/><path d="M116 100 C120 72 116 52 114 36 L102 36 C106 52 108 72 110 100 Z" fill="%232c2c2e"/><path d="M82 52 C76 64 78 80 86 92 C86 76 86 60 82 52 Z" fill="%2330d158"/><path d="M118 52 C124 64 122 80 114 92 C114 76 114 60 118 52 Z" fill="%2330d158"/><rect x="64" y="60" width="24" height="16" rx="4" fill="%238e8e93"/><rect x="112" y="60" width="24" height="16" rx="4" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><circle cx="100" cy="80" r="16" fill="%233a3a3c"/><path d="M84 100 L80 170 L120 170 L116 100 Z" fill="%233a3a3c"/><path d="M84 100 C80 72 84 48 88 20 L98 20 C94 48 92 72 90 100 Z" fill="%232c2c2e"/><path d="M116 100 C120 72 116 48 112 20 L102 20 C106 48 108 72 110 100 Z" fill="%232c2c2e"/><path d="M82 48 C78 62 80 80 88 92 C86 76 86 60 82 48 Z" fill="%2330d158"/><path d="M118 48 C122 62 120 80 112 92 C114 76 114 60 118 48 Z" fill="%2330d158"/><rect x="84" y="10" width="32" height="16" rx="4" fill="%238e8e93"/></svg>'
      },
      chest: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><rect x="30" y="120" width="140" height="12" rx="6" fill="%232c2c2e"/><rect x="50" y="132" width="12" height="36" fill="%232c2c2e"/><rect x="138" y="132" width="12" height="36" fill="%232c2c2e"/><circle cx="56" cy="108" r="16" fill="%233a3a3c"/><path d="M72 104 L150 104 L140 120 L72 120 Z" fill="%233a3a3c"/><path d="M88 104 C88 88 96 80 80 76 L68 92 Z" fill="%232c2c2e"/><path d="M112 104 C112 88 104 80 120 76 L132 92 Z" fill="%232c2c2e"/><path d="M84 104 C92 96 100 96 100 104 Z" fill="%2330d158"/><path d="M116 104 C108 96 100 96 100 104 Z" fill="%2330d158"/><rect x="56" y="68" width="24" height="14" rx="4" fill="%238e8e93"/><rect x="120" y="68" width="24" height="14" rx="4" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><rect x="30" y="120" width="140" height="12" rx="6" fill="%232c2c2e"/><rect x="50" y="132" width="12" height="36" fill="%232c2c2e"/><rect x="138" y="132" width="12" height="36" fill="%232c2c2e"/><circle cx="56" cy="108" r="16" fill="%233a3a3c"/><path d="M72 104 L150 104 L140 120 L72 120 Z" fill="%233a3a3c"/><path d="M88 104 C88 80 92 60 88 40 L96 40 C100 60 96 80 92 104 Z" fill="%232c2c2e"/><path d="M112 104 C112 80 108 60 112 40 L104 40 C100 60 104 80 108 104 Z" fill="%232c2c2e"/><path d="M84 104 C92 92 100 92 100 104 Z" fill="%2330d158"/><path d="M116 104 C108 92 100 92 100 104 Z" fill="%2330d158"/><rect x="80" y="28" width="40" height="16" rx="4" fill="%238e8e93"/></svg>'
      },
      back: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><rect x="40" y="140" width="120" height="10" rx="4" fill="%232c2c2e"/><rect x="60" y="150" width="10" height="30" fill="%232c2c2e"/><circle cx="144" cy="72" r="16" fill="%233a3a3c"/><path d="M132 80 L80 100 L64 140 L84 140 L96 112 L128 92 Z" fill="%233a3a3c"/><path d="M112 88 C100 96 92 112 88 140 L100 140 C104 116 112 104 120 92 Z" fill="%232c2c2e"/><path d="M108 88 C96 92 84 92 96 104 Z" fill="%2330d158"/><rect x="76" y="132" width="24" height="16" rx="4" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none"><rect width="200" height="200" rx="20" fill="%23121212"/><rect x="40" y="140" width="120" height="10" rx="4" fill="%232c2c2e"/><rect x="60" y="150" width="10" height="30" fill="%232c2c2e"/><circle cx="144" cy="72" r="16" fill="%233a3a3c"/><path d="M132 80 L80 100 L64 140 L84 140 L96 112 L128 92 Z" fill="%233a3a3c"/><path d="M112 88 C104 84 96 76 92 68 L104 68 C108 76 112 80 116 84 Z" fill="%232c2c2e"/><path d="M108 88 C96 92 84 88 96 80 Z" fill="%2330d158"/><rect x="84" y="60" width="24" height="16" rx="4" fill="%238e8e93"/></svg>'
      }
    };

    var exerciseLibrary = {
      "dumbbell curls": { muscle: "biceps", artKey: "biceps" },
      "bicep curls": { muscle: "biceps", artKey: "biceps" },
      "tricep extensions": { muscle: "triceps", artKey: "triceps" },
      "triceps extension": { muscle: "triceps", artKey: "triceps" },
      "dumbbell bench press": { muscle: "chest", artKey: "chest" },
      "chest press": { muscle: "chest", artKey: "chest" },
      "single-arm rows": { muscle: "back", artKey: "back" }
    };

    var defaultExercises = [
      { id: 1, name: "Dumbbell Curls", muscle: "biceps", artKey: "biceps" },
      { id: 2, name: "Tricep Extensions", muscle: "triceps", artKey: "triceps" },
      { id: 3, name: "Dumbbell Bench Press", muscle: "chest", artKey: "chest" },
      { id: 4, name: "Single-Arm Rows", muscle: "back", artKey: "back" }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_dumbbell_timer_offline');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;
    var animationInterval = null;
    var isEndPosition = false;

    function startAnimation() {
      stopAnimation();
      animationInterval = setInterval(function() {
        if (isRunning && isWorkPhase) {
          isEndPosition = !isEndPosition;
        } else {
          isEndPosition = false;
        }
        updateArtDisplay();
      }, 1200);
    }

    function stopAnimation() {
      if (animationInterval) clearInterval(animationInterval);
    }

    function updateArtDisplay() {
      var artImg = document.getElementById('exerciseArt');
      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      var artKey = currentEx.artKey || 'biceps';
      var set = renderAssets[artKey] || renderAssets.biceps;

      if (!isWorkPhase) {
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        var nextArtKey = nextEx ? nextEx.artKey : 'biceps';
        set = renderAssets[nextArtKey] || renderAssets.biceps;
        artImg.src = set.start;
      } else {
        artImg.src = isEndPosition ? set.end : set.start;
      }
    }

    function autoDetectConfig() {
      var nameVal = document.getElementById('newExName').value.trim().toLowerCase();
      if (exerciseLibrary[nameVal]) {
        var match = exerciseLibrary[nameVal];
        document.getElementById('newExMuscle').value = match.muscle;
        document.getElementById('newExArt').value = match.artKey;
      }
    }

    function saveExercises() {
      try {
        localStorage.setItem('ios_dumbbell_timer_offline', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Dumbbell Timer";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();
      startAnimation();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      isEndPosition = false;
      updateDisplay();
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      isEndPosition = false;
      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work Phase";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "UPPER BODY");
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest Phase";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");
      }

      updateArtDisplay();
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      stopAnimation();
      isRunning = false;
      isWorkPhase = true;
      isEndPosition = false;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var name = nameInput.value.trim();

      if (!name) return;

      var muscleSelect = document.getElementById('newExMuscle').value;
      var artSelect = document.getElementById('newExArt').value;

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: muscleSelect,
        artKey: artSelect
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Initialize App State
    resetWorkout();
  </script>
</body>
</html>
