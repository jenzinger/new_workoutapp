<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dumbbell Workout Timer</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dumbbell Workout">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* Diagram & Visual Area */
    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 250px;
      height: 250px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Embedded SVG Frames */
    .exercise-frame {
      display: none;
      width: 200px;
      height: 200px;
      align-items: center;
      justify-content: center;
    }

    .exercise-frame.active {
      display: flex;
    }

    /* Form Positions inside SVG */
    .pos-a, .pos-b {
      transition: opacity 0.3s ease-in-out;
    }

    .pos-b { opacity: 0; }
    .pos-a { opacity: 1; }

    /* Alternate Motion Effect */
    .animating .pos-a {
      animation: toggleStageA 1.2s infinite alternate ease-in-out;
    }
    .animating .pos-b {
      animation: toggleStageB 1.2s infinite alternate ease-in-out;
    }

    @keyframes toggleStageA {
      0%, 45% { opacity: 1; }
      55%, 100% { opacity: 0; }
    }

    @keyframes toggleStageB {
      0%, 45% { opacity: 0; }
      55%, 100% { opacity: 1; }
    }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 16px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .muscle-label {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }

    .time-left {
      font-size: 76px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -2px;
    }

    .rounds-count {
      font-size: 14px;
      color: var(--subtext-color);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label { font-size: 15px; color: var(--subtext-color); }

    .setting-row input {
      width: 70px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 12px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info { display: flex; flex-direction: column; }
    .ex-name { font-size: 16px; font-weight: 600; }
    .ex-target { font-size: 11px; color: var(--subtext-color); text-transform: uppercase; margin-top: 2px; letter-spacing: 0.5px; }
    .ex-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Dumbbell Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">

        <!-- BICEPS: Bicep Curls -->
        <div class="exercise-frame active" id="frame-biceps">
          <svg width="180" height="180" viewBox="0 0 100 100" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- Bench Base -->
            <path d="M 20 85 L 80 85" stroke="#48484a" stroke-width="2" />
            <path d="M 35 85 L 35 50 L 65 50" stroke="#48484a" stroke-width="2" />
            
            <!-- Pos A: Arms Extended -->
            <g class="pos-a">
              <circle cx="50" cy="22" r="7" fill="#ffffff" stroke="none" />
              <path d="M 50 29 L 50 55" />
              <path d="M 50 38 L 50 62" /> <!-- Arm down -->
              <circle cx="50" cy="65" r="4" fill="#ffffff" /> <!-- Dumbbell -->
            </g>

            <!-- Pos B: Peak Curl Contraction -->
            <g class="pos-b">
              <circle cx="50" cy="22" r="7" fill="#ffffff" stroke="none" />
              <path d="M 50 29 L 50 55" />
              <path d="M 50 38 L 42 48 L 50 35" /> <!-- Curled Arm -->
              <circle cx="50" cy="33" r="4" fill="#ffffff" /> <!-- Dumbbell top -->
            </g>
          </svg>
        </div>

        <!-- TRICEPS: Overhead Tricep Extension -->
        <div class="exercise-frame" id="frame-triceps">
          <svg width="180" height="180" viewBox="0 0 100 100" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 30 85 L 70 85" stroke="#48484a" stroke-width="2" />
            
            <!-- Pos A: Elbows Flexed Behind Head -->
            <g class="pos-a">
              <circle cx="50" cy="45" r="7" fill="#ffffff" stroke="none" />
              <path d="M 50 52 L 50 85" />
              <path d="M 50 60 L 52 35 L 42 42" /> <!-- Lowered forearm -->
              <circle cx="40" cy="44" r="4" fill="#ffffff" /> <!-- Dumbbell behind -->
            </g>

            <!-- Pos B: Fully Extended Overhead -->
            <g class="pos-b">
              <circle cx="50" cy="45" r="7" fill="#ffffff" stroke="none" />
              <path d="M 50 52 L 50 85" />
              <path d="M 50 60 L 50 18" /> <!-- Extended overhead -->
              <circle cx="50" cy="14" r="4" fill="#ffffff" /> <!-- Dumbbell top -->
            </g>
          </svg>
        </div>

        <!-- CHEST: Flat Dumbbell Bench Press -->
        <div class="exercise-frame" id="frame-chest">
          <svg width="180" height="180" viewBox="0 0 100 100" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 15 65 L 85 65 M 30 65 L 30 85 M 70 65 L 70 85" stroke="#48484a" stroke-width="2" />
            
            <!-- Pos A: Dumbbells at Chest Level -->
            <g class="pos-a">
              <circle cx="22" cy="57" r="6" fill="#ffffff" stroke="none" />
              <path d="M 28 60 L 75 60" /> <!-- Torso on bench -->
              <path d="M 45 60 L 45 50 M 45 50 L 40 52" /> <!-- Forearm low -->
              <circle cx="40" cy="50" r="4" fill="#ffffff" /> <!-- Weight low -->
            </g>

            <!-- Pos B: Pressed Overhead -->
            <g class="pos-b">
              <circle cx="22" cy="57" r="6" fill="#ffffff" stroke="none" />
              <path d="M 28 60 L 75 60" />
              <path d="M 45 60 L 45 30" /> <!-- Extended Arm -->
              <circle cx="45" cy="26" r="4" fill="#ffffff" /> <!-- Weight top -->
            </g>
          </svg>
        </div>

        <!-- BACK: Single-Arm Dumbbell Row -->
        <div class="exercise-frame" id="frame-back">
          <svg width="180" height="180" viewBox="0 0 100 100" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 20 75 L 80 75" stroke="#48484a" stroke-width="2" />
            <path d="M 30 75 L 30 50 L 50 50" stroke="#48484a" stroke-width="2" />
            
            <!-- Pos A: Arm Extended Lowered -->
            <g class="pos-a">
              <circle cx="68" cy="35" r="6" fill="#ffffff" stroke="none" />
              <path d="M 64 38 L 38 48" /> <!-- Flat spine hinge -->
              <path d="M 50 43 L 50 72" /> <!-- Arm hanging down -->
              <circle cx="50" cy="75" r="4" fill="#ffffff" /> <!-- Dumbbell bottom -->
            </g>

            <!-- Pos B: Elbow Pulled to Hip Row -->
            <g class="pos-b">
              <circle cx="68" cy="35" r="6" fill="#ffffff" stroke="none" />
              <path d="M 64 38 L 38 48" />
              <path d="M 50 43 L 48 30 L 42 45" /> <!-- Pulled elbow -->
              <circle cx="42" cy="47" r="4" fill="#ffffff" /> <!-- Dumbbell to hip -->
            </g>
          </svg>
        </div>

      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Dumbbell Curls</div>
      <div class="muscle-label" id="muscleLabel">Target: BICEPS</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add Dumbbell Exercise</h3>
        
        <!-- Preformed Datalist Auto-Complete -->
        <input type="text" id="newExName" list="exercisePresets" placeholder="Type or select exercise (e.g. Bicep Curls)" oninput="autoDetectConfig()">
        
        <datalist id="exercisePresets">
          <option value="Dumbbell Curls">
          <option value="Hammer Curls">
          <option value="Tricep Extensions">
          <option value="Tricep Kickbacks">
          <option value="Dumbbell Bench Press">
          <option value="Chest Flyes">
          <option value="Single-Arm Rows">
          <option value="Bent-Over Rows">
        </datalist>

        <select id="newExMuscle">
          <option value="biceps">Biceps (Arms)</option>
          <option value="triceps">Triceps (Arms)</option>
          <option value="chest">Chest (Pectorals)</option>
          <option value="back">Back (Lats &amp; Traps)</option>
        </select>

        <select id="newExFrame">
          <option value="frame-biceps">Biceps Motion</option>
          <option value="frame-triceps">Triceps Motion</option>
          <option value="frame-chest">Chest Press Motion</option>
          <option value="frame-back">Back Row Motion</option>
        </select>

        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    var exerciseLibrary = {
      "dumbbell curls": { muscle: "biceps", frame: "frame-biceps" },
      "bicep curls": { muscle: "biceps", frame: "frame-biceps" },
      "hammer curls": { muscle: "biceps", frame: "frame-biceps" },
      "tricep extensions": { muscle: "triceps", frame: "frame-triceps" },
      "triceps extension": { muscle: "triceps", frame: "frame-triceps" },
      "tricep kickbacks": { muscle: "triceps", frame: "frame-triceps" },
      "dumbbell bench press": { muscle: "chest", frame: "frame-chest" },
      "chest press": { muscle: "chest", frame: "frame-chest" },
      "chest flyes": { muscle: "chest", frame: "frame-chest" },
      "single-arm rows": { muscle: "back", frame: "frame-back" },
      "dumbbell rows": { muscle: "back", frame: "frame-back" },
      "bent-over rows": { muscle: "back", frame: "frame-back" }
    };

    var defaultExercises = [
      { id: 1, name: "Dumbbell Curls", muscle: "biceps", frame: "frame-biceps" },
      { id: 2, name: "Tricep Extensions", muscle: "triceps", frame: "frame-triceps" },
      { id: 3, name: "Dumbbell Bench Press", muscle: "chest", frame: "frame-chest" },
      { id: 4, name: "Single-Arm Rows", muscle: "back", frame: "frame-back" }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_dumbbell_exercises_v6');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;

    function autoDetectConfig() {
      var nameVal = document.getElementById('newExName').value.trim().toLowerCase();
      if (exerciseLibrary[nameVal]) {
        var match = exerciseLibrary[nameVal];
        document.getElementById('newExMuscle').value = match.muscle;
        document.getElementById('newExFrame').value = match.frame;
      }
    }

    function saveExercises() {
      try {
        localStorage.setItem('ios_dumbbell_exercises_v6', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Dumbbell Timer";
        resetWorkout();
      }
    }

    function renderActiveFrame(frameId, isAnimating) {
      var frames = document.querySelectorAll('.exercise-frame');
      frames.forEach(function(f) {
        f.classList.remove('active', 'animating');
      });

      var target = document.getElementById(frameId) || document.getElementById('frame-biceps');
      target.classList.add('active');

      if (isAnimating) {
        target.classList.add('animating');
      }
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      updateDisplay();
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work Phase";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "UPPER BODY");

        renderActiveFrame(currentEx.frame || 'frame-biceps', isRunning);
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest Phase";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");

        renderActiveFrame(nextEx ? nextEx.frame : 'frame-biceps', false);
      }
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var name = nameInput.value.trim();

      if (!name) return;

      var muscleSelect = document.getElementById('newExMuscle').value;
      var frameSelect = document.getElementById('newExFrame').value;

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: muscleSelect,
        frame: frameSelect
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Run initial load
    resetWorkout();
  </script>
</body>
</html>
