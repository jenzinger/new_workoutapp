<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Anatomical Workout Timer</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --card-inner: #2c2c2e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --muscle-active: #ff3b30;
      --muscle-glow: rgba(255, 59, 48, 0.6);
      --muscle-base: #3a3a3c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid #2c2c2e;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* Anatomical Diagram Area */
    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 240px;
      height: 240px;
      background-color: var(--card-bg);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    /* Anatomical Model Vectors */
    .figure-container {
      width: 140px;
      height: 200px;
      transform-origin: center center;
    }

    .skeleton-base { fill: #2c2c2e; stroke: #48484a; stroke-width: 1; }
    .muscle { fill: var(--muscle-base); transition: fill 0.3s ease, filter 0.3s ease; }
    .muscle.active {
      fill: var(--muscle-active);
      filter: drop-shadow(0 0 8px var(--muscle-glow));
    }

    /* Movement Keyframe Animations */
    .anim-jumping-jacks {
      animation: jack-move 0.8s infinite alternate ease-in-out;
    }
    @keyframes jack-move {
      0% { transform: translateY(0) scale(1, 1); }
      100% { transform: translateY(-12px) scale(1.08, 0.95); }
    }

    .anim-push-ups {
      animation: pushup-move 1.2s infinite alternate ease-in-out;
    }
    @keyframes pushup-move {
      0% { transform: rotate(-75deg) translateY(0); }
      100% { transform: rotate(-75deg) translateY(25px); }
    }

    .anim-squats {
      animation: squat-move 1s infinite alternate ease-in-out;
    }
    @keyframes squat-move {
      0% { transform: translateY(0) scaleY(1); }
      100% { transform: translateY(30px) scaleY(0.75); }
    }

    .anim-crunches {
      animation: crunch-move 0.9s infinite alternate ease-in-out;
    }
    @keyframes crunch-move {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(15deg) translateY(10px); }
    }

    .anim-rest {
      animation: rest-breathe 2.5s infinite alternate ease-in-out;
    }
    @keyframes rest-breathe {
      0% { transform: scale(0.98); opacity: 0.8; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 14px;
      text-align: center;
    }

    .muscle-label {
      font-size: 13px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.2); color: var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.2); color: var(--accent-rest); }

    .timer-display {
      text-align: center;
      margin: 8px 0;
    }

    .time-left {
      font-size: 72px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .rounds-count {
      font-size: 15px;
      color: var(--subtext-color);
      margin-top: 6px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label {
      font-size: 15px;
      color: var(--subtext-color);
    }

    .setting-row input {
      width: 65px;
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 10px 16px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info {
      display: flex;
      flex-direction: column;
    }

    .ex-name {
      font-size: 16px;
      font-weight: 600;
    }

    .ex-target {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .ex-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Workout Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <div class="figure-container" id="figureBox">
          <!-- Detailed Vector Anatomical Model -->
          <svg width="140" height="200" viewBox="0 0 100 140">
            <!-- Head & Neck -->
            <circle cx="50" cy="15" r="8" class="skeleton-base" />
            
            <!-- Deltoids / Shoulders -->
            <path id="m-shoulders-left" class="muscle" d="M 34 26 C 30 28 32 36 36 36 C 38 32 38 28 34 26 Z" />
            <path id="m-shoulders-right" class="muscle" d="M 66 26 C 70 28 68 36 64 36 C 62 32 62 28 66 26 Z" />

            <!-- Pectorals / Chest -->
            <path id="m-chest" class="muscle" d="M 38 28 Q 50 30 50 40 Q 38 40 38 28 Z M 62 28 Q 50 30 50 40 Q 62 40 62 28 Z" />

            <!-- Lats / Back -->
            <path id="m-back" class="muscle" d="M 35 38 C 35 50 42 54 44 54 L 42 38 Z M 65 38 C 65 50 58 54 56 54 L 58 38 Z" />

            <!-- Rectus Abdominis / Core -->
            <path id="m-abs" class="muscle" d="M 44 42 L 56 42 L 55 48 L 45 48 Z M 44 50 L 56 50 L 55 56 L 45 56 Z M 45 58 L 55 58 L 54 66 L 46 66 Z" />

            <!-- Biceps / Triceps / Arms -->
            <path id="m-arms-left" class="muscle" d="M 31 38 C 28 42 29 52 32 54 C 35 52 35 42 31 38 Z" />
            <path id="m-arms-right" class="muscle" d="M 69 38 C 72 42 71 52 68 54 C 65 52 65 42 69 38 Z" />

            <!-- Forearms -->
            <path id="m-forearms-left" class="muscle" d="M 28 56 C 26 62 28 70 30 72 C 32 70 32 62 28 56 Z" />
            <path id="m-forearms-right" class="muscle" d="M 72 56 C 74 62 72 70 70 72 C 68 70 68 62 72 56 Z" />

            <!-- Quadriceps / Legs -->
            <path id="m-legs-left" class="muscle" d="M 40 70 C 36 80 38 100 44 102 C 48 98 46 80 44 70 Z" />
            <path id="m-legs-right" class="muscle" d="M 60 70 C 64 80 62 100 56 102 C 52 98 54 80 56 70 Z" />

            <!-- Calves -->
            <path id="m-calves-left" class="muscle" d="M 39 106 C 36 114 38 126 41 130 C 43 126 43 114 41 106 Z" />
            <path id="m-calves-right" class="muscle" d="M 61 106 C 64 114 62 126 59 130 C 57 126 57 114 59 106 Z" />
          </svg>
        </div>
      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Jumping Jacks</div>
      <div class="muscle-label" id="muscleLabel">Target: LEGS &amp; CALVES</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add New Exercise</h3>
        <input type="text" id="newExName" placeholder="Exercise Name (e.g. Pull-ups)">
        <select id="newExMuscle">
          <option value="chest">Chest (Pectorals)</option>
          <option value="abs">Core / Abs</option>
          <option value="legs">Legs (Quads &amp; Calves)</option>
          <option value="arms">Arms (Biceps &amp; Triceps)</option>
          <option value="shoulders">Shoulders (Deltoids)</option>
          <option value="back">Back (Lats &amp; Traps)</option>
        </select>
        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    var defaultExercises = [
      { id: 1, name: "Jumping Jacks", muscle: "legs", anim: "anim-jumping-jacks" },
      { id: 2, name: "Push-ups", muscle: "chest", anim: "anim-push-ups" },
      { id: 3, name: "Crunches", muscle: "abs", anim: "anim-crunches" },
      { id: 4, name: "Squats", muscle: "legs", anim: "anim-squats" }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_workout_exercises_v2');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;

    function saveExercises() {
      try {
        localStorage.setItem('ios_workout_exercises_v2', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Workout Timer";
        resetWorkout();
      }
    }

    function highlightMuscle(targetMuscle) {
      var allMuscles = document.querySelectorAll('.muscle');
      for (var i = 0; i < allMuscles.length; i++) {
        allMuscles[i].classList.remove('active');
      }

      if (targetMuscle === 'chest') {
        document.getElementById('m-chest').classList.add('active');
      } else if (targetMuscle === 'abs') {
        document.getElementById('m-abs').classList.add('active');
      } else if (targetMuscle === 'legs') {
        document.getElementById('m-legs-left').classList.add('active');
        document.getElementById('m-legs-right').classList.add('active');
        document.getElementById('m-calves-left').classList.add('active');
        document.getElementById('m-calves-right').classList.add('active');
      } else if (targetMuscle === 'arms') {
        document.getElementById('m-arms-left').classList.add('active');
        document.getElementById('m-arms-right').classList.add('active');
        document.getElementById('m-forearms-left').classList.add('active');
        document.getElementById('m-forearms-right').classList.add('active');
      } else if (targetMuscle === 'shoulders') {
        document.getElementById('m-shoulders-left').classList.add('active');
        document.getElementById('m-shoulders-right').classList.add('active');
      } else if (targetMuscle === 'back') {
        document.getElementById('m-back').classList.add('active');
      }
    }

    function setAnimation(animClass) {
      var fig = document.getElementById('figureBox');
      fig.className = 'figure-container ' + (animClass || '');
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      setAnimation('anim-rest');
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || { name: "None", muscle: "none", anim: "" };
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Exercise";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "GENERAL");
        highlightMuscle(currentEx.muscle);
        
        // Auto-assign animation class if none defined
        var animName = currentEx.anim;
        if (!animName) {
          if (currentEx.muscle === 'chest') animName = 'anim-push-ups';
          else if (currentEx.muscle === 'abs') animName = 'anim-crunches';
          else if (currentEx.muscle === 'legs') animName = 'anim-squats';
          else animName = 'anim-jumping-jacks';
        }
        setAnimation(isRunning ? animName : 'anim-rest');
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Pause / Rest";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");
        highlightMuscle('none');
        setAnimation('anim-rest');
      }
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var muscleSelect = document.getElementById('newExMuscle');
      var name = nameInput.value.trim();

      if (!name) return;

      var selectedMuscle = muscleSelect.value;
      var animClass = "anim-jumping-jacks";
      if (selectedMuscle === 'chest') animClass = "anim-push-ups";
      if (selectedMuscle === 'abs') animClass = "anim-crunches";
      if (selectedMuscle === 'legs') animClass = "anim-squats";

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: selectedMuscle,
        anim: animClass
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Run initial load
    resetWorkout();
  </script>
</body>
</html>
