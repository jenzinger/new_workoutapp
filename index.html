<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimalist Workout Timer</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* Diagram & Visual Area */
    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 250px;
      height: 250px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 2-Frame Image Alternator */
    .exercise-viewer {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .pos-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: invert(1) brightness(1.8) contrast(1.2); /* Inverts dark art to stark white-on-black */
      transition: opacity 0.3s ease-in-out;
    }

    /* Rest/Static state */
    .pos-img.img-b { opacity: 0; }
    .pos-img.img-a { opacity: 1; }

    /* Motion Animation via Opacity Toggle */
    .animating .pos-img.img-a {
      animation: toggleStageA 1.2s infinite alternate ease-in-out;
    }
    .animating .pos-img.img-b {
      animation: toggleStageB 1.2s infinite alternate ease-in-out;
    }

    @keyframes toggleStageA {
      0%, 45% { opacity: 1; }
      55%, 100% { opacity: 0; }
    }

    @keyframes toggleStageB {
      0%, 45% { opacity: 0; }
      55%, 100% { opacity: 1; }
    }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 16px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .muscle-label {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }

    .time-left {
      font-size: 76px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -2px;
    }

    .rounds-count {
      font-size: 14px;
      color: var(--subtext-color);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label { font-size: 15px; color: var(--subtext-color); }

    .setting-row input {
      width: 70px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 12px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info { display: flex; flex-direction: column; }
    .ex-name { font-size: 16px; font-weight: 600; }
    .ex-target { font-size: 11px; color: var(--subtext-color); text-transform: uppercase; margin-top: 2px; letter-spacing: 0.5px; }
    .ex-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Workout Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <!-- Dual Image Viewer -->
        <div class="exercise-viewer" id="exerciseViewer">
          <img id="imgPosA" src="" class="pos-img img-a" alt="Position A">
          <img id="imgPosB" src="" class="pos-img img-b" alt="Position B">
        </div>
      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Jumping Jacks</div>
      <div class="muscle-label" id="muscleLabel">Target: LEGS & CALVES</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add New Exercise</h3>
        
        <!-- Preformed Datalist Auto-Complete & Custom Text Entry -->
        <input type="text" id="newExName" list="exercisePresets" placeholder="Type or select exercise (e.g. Squats)" oninput="autoDetectConfig()">
        
        <datalist id="exercisePresets">
          <option value="Jumping Jacks">
          <option value="Push-ups">
          <option value="Squats">
          <option value="Crunches">
          <option value="Plank">
          <option value="Lunges">
          <option value="Burpees">
          <option value="High Knees">
        </datalist>

        <select id="newExMuscle">
          <option value="legs">Legs (Quads &amp; Calves)</option>
          <option value="chest">Chest (Pectorals)</option>
          <option value="abs">Core / Abs</option>
          <option value="arms">Arms (Biceps &amp; Triceps)</option>
          <option value="shoulders">Shoulders (Deltoids)</option>
        </select>

        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    // Dictionary mapping standard exercises to white-on-black phase images (Start/Peak)
    var exerciseLibrary = {
      "jumping jacks": {
        muscle: "legs",
        imgA: "https://svgshare.com/i/14eb.svg", // Stance
        imgB: "https://svgshare.com/i/14f1.svg"  // Overhead Star
      },
      "push-ups": {
        muscle: "chest",
        imgA: "https://svgshare.com/i/14ec.svg", // Plank top
        imgB: "https://svgshare.com/i/14f2.svg"  // Chest low
      },
      "pushups": {
        muscle: "chest",
        imgA: "https://svgshare.com/i/14ec.svg",
        imgB: "https://svgshare.com/i/14f2.svg"
      },
      "squats": {
        muscle: "legs",
        imgA: "https://svgshare.com/i/14ed.svg", // Standing
        imgB: "https://svgshare.com/i/14f3.svg"  // Parallel Squat
      },
      "crunches": {
        muscle: "abs",
        imgA: "https://svgshare.com/i/14ee.svg", // Flat rest
        imgB: "https://svgshare.com/i/14f4.svg"  // Abdominal Flexion
      },
      "plank": {
        muscle: "abs",
        imgA: "https://svgshare.com/i/14ec.svg",
        imgB: "https://svgshare.com/i/14ec.svg"
      },
      "lunges": {
        muscle: "legs",
        imgA: "https://svgshare.com/i/14ed.svg",
        imgB: "https://svgshare.com/i/14f3.svg"
      }
    };

    var defaultExercises = [
      { id: 1, name: "Jumping Jacks", muscle: "legs", imgA: exerciseLibrary["jumping jacks"].imgA, imgB: exerciseLibrary["jumping jacks"].imgB },
      { id: 2, name: "Push-ups", muscle: "chest", imgA: exerciseLibrary["push-ups"].imgA, imgB: exerciseLibrary["push-ups"].imgB },
      { id: 3, name: "Squats", muscle: "legs", imgA: exerciseLibrary["squats"].imgA, imgB: exerciseLibrary["squats"].imgB },
      { id: 4, name: "Crunches", muscle: "abs", imgA: exerciseLibrary["crunches"].imgA, imgB: exerciseLibrary["crunches"].imgB }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_workout_exercises_v5');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;

    function autoDetectConfig() {
      var nameVal = document.getElementById('newExName').value.trim().toLowerCase();
      if (exerciseLibrary[nameVal]) {
        var match = exerciseLibrary[nameVal];
        document.getElementById('newExMuscle').value = match.muscle;
      }
    }

    function saveExercises() {
      try {
        localStorage.setItem('ios_workout_exercises_v5', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Workout Timer";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      updateDisplay();
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');
      var viewer = document.getElementById('exerciseViewer');

      var imgA = document.getElementById('imgPosA');
      var imgB = document.getElementById('imgPosB');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work Phase";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "GENERAL");

        imgA.src = currentEx.imgA || exerciseLibrary["jumping jacks"].imgA;
        imgB.src = currentEx.imgB || exerciseLibrary["jumping jacks"].imgB;

        if (isRunning) {
          viewer.classList.add('animating');
        } else {
          viewer.classList.remove('animating');
        }
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest Phase";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");

        imgA.src = nextEx ? (nextEx.imgA || exerciseLibrary["jumping jacks"].imgA) : exerciseLibrary["jumping jacks"].imgA;
        imgB.src = nextEx ? (nextEx.imgB || exerciseLibrary["jumping jacks"].imgB) : exerciseLibrary["jumping jacks"].imgB;

        viewer.classList.remove('animating');
      }
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var name = nameInput.value.trim();

      if (!name) return;

      var nameKey = name.toLowerCase();
      var preset = exerciseLibrary[nameKey] || exerciseLibrary["jumping jacks"];

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: document.getElementById('newExMuscle').value || preset.muscle,
        imgA: preset.imgA,
        imgB: preset.imgB
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Run initial load
    resetWorkout();
  </script>
</body>
</html>
