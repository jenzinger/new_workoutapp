<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dumbbell Canvas Timer</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dumbbell Timer">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* Diagram & Canvas Area */
    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 240px;
      height: 240px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 200px;
      height: 200px;
    }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 16px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .muscle-label {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }

    .time-left {
      font-size: 76px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -2px;
    }

    .rounds-count {
      font-size: 14px;
      color: var(--subtext-color);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label { font-size: 15px; color: var(--subtext-color); }

    .setting-row input {
      width: 70px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 12px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info { display: flex; flex-direction: column; }
    .ex-name { font-size: 16px; font-weight: 600; }
    .ex-target { font-size: 11px; color: var(--subtext-color); text-transform: uppercase; margin-top: 2px; letter-spacing: 0.5px; }
    .ex-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Dumbbell Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <!-- Interactive Canvas Element -->
        <canvas id="exerciseCanvas" width="200" height="200"></canvas>
      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Bicep Curls</div>
      <div class="muscle-label" id="muscleLabel">Target: BICEPS</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add Dumbbell Exercise</h3>
        
        <input type="text" id="newExName" list="exercisePresets" placeholder="Type or select exercise (e.g. Tricep Extensions)" oninput="autoDetectConfig()">
        
        <datalist id="exercisePresets">
          <option value="Dumbbell Curls">
          <option value="Hammer Curls">
          <option value="Tricep Extensions">
          <option value="Tricep Kickbacks">
          <option value="Dumbbell Bench Press">
          <option value="Chest Flyes">
          <option value="Single-Arm Rows">
          <option value="Bent-Over Rows">
        </datalist>

        <select id="newExMuscle">
          <option value="biceps">Biceps (Arms)</option>
          <option value="triceps">Triceps (Arms)</option>
          <option value="chest">Chest (Pectorals)</option>
          <option value="back">Back (Lats &amp; Traps)</option>
        </select>

        <select id="newExType">
          <option value="biceps">Bicep Curl Animation</option>
          <option value="triceps">Triceps Extension Animation</option>
          <option value="chest">Chest Press Animation</option>
          <option value="back">Back Row Animation</option>
        </select>

        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('exerciseCanvas');
    var ctx = canvas.getContext('2d');
    var animationFrameId = null;
    var animProgress = 0;

    var exerciseLibrary = {
      "dumbbell curls": { muscle: "biceps", type: "biceps" },
      "bicep curls": { muscle: "biceps", type: "biceps" },
      "hammer curls": { muscle: "biceps", type: "biceps" },
      "tricep extensions": { muscle: "triceps", type: "triceps" },
      "triceps extension": { muscle: "triceps", type: "triceps" },
      "tricep kickbacks": { muscle: "triceps", type: "triceps" },
      "dumbbell bench press": { muscle: "chest", type: "chest" },
      "chest press": { muscle: "chest", type: "chest" },
      "single-arm rows": { muscle: "back", type: "back" },
      "dumbbell rows": { muscle: "back", type: "back" }
    };

    var defaultExercises = [
      { id: 1, name: "Dumbbell Curls", muscle: "biceps", type: "biceps" },
      { id: 2, name: "Tricep Extensions", muscle: "triceps", type: "triceps" },
      { id: 3, name: "Dumbbell Bench Press", muscle: "chest", type: "chest" },
      { id: 4, name: "Single-Arm Rows", muscle: "back", type: "back" }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_dumbbell_canvas_v1');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;

    /* --- CANVAS DRAWING FUNCTIONS (Option 1 Math Animations) --- */

    function clearCanvas() {
      ctx.clearRect(0, 0, 200, 200);
    }

    function drawHead(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r || 8, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    function drawJoint(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r || 4, 0, Math.PI * 2);
      ctx.fillStyle = '#30d158';
      ctx.fill();
    }

    function drawWeight(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r || 7, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#30d158';
      ctx.stroke();
    }

    function drawLine(x1, y1, x2, y2, width) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineWidth = width || 3.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    function renderBiceps(factor) {
      clearCanvas();
      // Seated Bench
      drawLine(40, 160, 160, 160, 2);
      drawLine(80, 160, 80, 100, 2);
      drawLine(80, 100, 140, 100, 2);

      // Head & Torso
      drawHead(100, 52);
      drawLine(100, 60, 100, 100); // Spine

      // Legs
      drawLine(100, 100, 120, 130);
      drawLine(120, 130, 120, 160);

      // Bicep Arm Motion
      var elbowX = 100, elbowY = 78;
      var curlAngle = 0.2 + (Math.sin(factor) + 1) * 0.9; // Smooth rotation arc
      var handX = elbowX - Math.sin(curlAngle) * 32;
      var handY = elbowY + Math.cos(curlAngle) * 32;

      drawLine(100, 68, elbowX, elbowY); // Upper Arm
      drawLine(elbowX, elbowY, handX, handY); // Forearm
      drawJoint(elbowX, elbowY);
      drawWeight(handX, handY);
    }

    function renderTriceps(factor) {
      clearCanvas();
      // Seat
      drawLine(60, 160, 140, 160, 2);
      drawLine(100, 160, 100, 110, 2);

      // Head & Torso
      drawHead(100, 80);
      drawLine(100, 88, 100, 135); // Spine

      // Vertical Upper Arm (Fixed overhead)
      var shoulderX = 100, shoulderY = 92;
      var elbowX = 100, elbowY = 52;
      drawLine(shoulderX, shoulderY, elbowX, elbowY);

      // Overhead Forearm Arc
      var extAngle = -0.3 + (Math.sin(factor) + 1) * 0.8;
      var handX = elbowX - Math.sin(extAngle) * 30;
      var handY = elbowY - Math.cos(extAngle) * 30;

      drawLine(elbowX, elbowY, handX, handY); // Forearm
      drawJoint(elbowX, elbowY);
      drawWeight(handX, handY);
    }

    function renderChest(factor) {
      clearCanvas();
      // Flat Bench
      drawLine(30, 130, 170, 130, 2);
      drawLine(50, 130, 50, 160, 2);
      drawLine(150, 130, 150, 160, 2);

      // Head & Lying Body
      drawHead(50, 122);
      drawLine(58, 125, 140, 125); // Spine on bench

      // Pressing Arm Vertical Motion
      var pressHeight = 100 - (Math.sin(factor) + 1) * 22;
      var shoulderX = 95, shoulderY = 125;
      var elbowX = 95, elbowY = (pressHeight + 125) / 2;

      drawLine(shoulderX, shoulderY, elbowX, elbowY);
      drawLine(elbowX, elbowY, 95, pressHeight);
      drawJoint(elbowX, elbowY);
      drawWeight(95, pressHeight);
    }

    function renderBack(factor) {
      clearCanvas();
      // Bench Support
      drawLine(30, 150, 150, 150, 2);
      drawLine(60, 150, 60, 100, 2);

      // Bent Over Body Stance
      drawHead(140, 75);
      drawLine(132, 80, 80, 95); // Hinged Spine
      drawLine(80, 95, 60, 150); // Leg

      // Row Pulling Motion
      var rowOffset = (Math.sin(factor) + 1) * 18;
      var shoulderX = 110, shoulderY = 86;
      var handX = 110, handY = 130 - rowOffset;
      var elbowX = 100, elbowY = 105 - (rowOffset * 0.8);

      drawLine(shoulderX, shoulderY, elbowX, elbowY);
      drawLine(elbowX, elbowY, handX, handY);
      drawJoint(elbowX, elbowY);
      drawWeight(handX, handY);
    }

    function animateLoop() {
      if (isRunning && isWorkPhase) {
        animProgress += 0.05;
      }

      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      var type = currentEx.type || 'biceps';

      if (!isWorkPhase) {
        // Rest state - Static display of next exercise
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        type = nextEx ? nextEx.type : 'biceps';
      }

      if (type === 'triceps') renderTriceps(animProgress);
      else if (type === 'chest') renderChest(animProgress);
      else if (type === 'back') renderBack(animProgress);
      else renderBiceps(animProgress);

      animationFrameId = requestAnimationFrame(animateLoop);
    }

    /* --- TIMER & APP CONTROLS --- */

    function autoDetectConfig() {
      var nameVal = document.getElementById('newExName').value.trim().toLowerCase();
      if (exerciseLibrary[nameVal]) {
        var match = exerciseLibrary[nameVal];
        document.getElementById('newExMuscle').value = match.muscle;
        document.getElementById('newExType').value = match.type;
      }
    }

    function saveExercises() {
      try {
        localStorage.setItem('ios_dumbbell_canvas_v1', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Dumbbell Timer";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      updateDisplay();
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work Phase";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "UPPER BODY");
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest Phase";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");
      }
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var name = nameInput.value.trim();

      if (!name) return;

      var muscleSelect = document.getElementById('newExMuscle').value;
      var typeSelect = document.getElementById('newExType').value;

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: muscleSelect,
        type: typeSelect
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Initialize Canvas Loop & App State
    resetWorkout();
    animateLoop();
  </script>
</body>
</html>
