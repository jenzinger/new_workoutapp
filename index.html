<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JENS' Muscle Maker</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #ff9800;
      --text-color: #ffffff;
      --text-muted: #b0b0b0;
      --work-color: #4caf50;
      --rest-color: #f44336;
      --prep-color: #2196f3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--accent-color);
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input, select, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: var(--text-color);
      font-size: 1rem;
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-group button {
      flex: 1;
    }

    #display-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phase-badge {
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 10px;
      display: inline-block;
    }

    .phase-prep { background-color: var(--prep-color); color: #fff; }
    .phase-work { background-color: var(--work-color); color: #fff; }
    .phase-rest { background-color: var(--rest-color); color: #fff; }

    .timer-display {
      font-size: 4rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      margin: 10px 0;
    }

    .media-container {
      width: 100%;
      height: 250px;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
    }

    .media-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .exercise-title {
      font-size: 1.4rem;
      margin: 10px 0 5px 0;
    }

    .info-text {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .sound-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>JENS' Muscle Maker</h1>
  </header>

  <div class="container">
    <!-- Setup / Configuration Card -->
    <div class="card" id="setup-card">
      <div class="controls-grid">
        <div class="control-group">
          <label for="prep-time">Prep (s)</label>
          <input type="number" id="prep-time" value="5" min="0" />
        </div>
        <div class="control-group">
          <label for="work-time">Work (s)</label>
          <input type="number" id="work-time" value="40" min="1" />
        </div>
        <div class="control-group">
          <label for="rest-time">Rest (s)</label>
          <input type="number" id="rest-time" value="20" min="0" />
        </div>
        <div class="control-group">
          <label for="cycles">Cycles</label>
          <input type="number" id="cycles" value="3" min="1" />
        </div>
      </div>

      <div class="sound-toggle">
        <label for="sound-enabled">Enable Sound Effects</label>
        <input type="checkbox" id="sound-enabled" checked />
      </div>

      <div class="btn-group" style="margin-top: 15px;">
        <button id="start-btn">Start Workout</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="reset-btn">Reset</button>
      </div>
    </div>

    <!-- Active Timer Display Card -->
    <div class="card" id="display-card">
      <div id="phase-badge" class="phase-badge phase-prep">READY</div>
      <div class="exercise-title" id="exercise-name">Press Start</div>
      <div class="timer-display" id="time-display">00:00</div>
      <div class="info-text" id="cycle-display">Cycle 0 / 0</div>

      <div class="media-container" id="media-container">
        <span class="info-text">Exercise Demo Area</span>
      </div>
    </div>
  </div>

  <script>
    // --- Web Audio API Setup & Synth Generators ---
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioCtx = new AudioCtx();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // High-energy, optimistic major arpeggio for starting work sets
    function playEnthusiasticStartSound() {
      if (!document.getElementById('sound-enabled').checked) return;
      initAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      // Vibrant ascending C Major arpeggio: C5, E5, G5, C6
      const notes = [523.25, 659.25, 783.99, 1046.50];
      const stepDuration = 0.07; 

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle'; // Bright, punchy tone
        osc.frequency.setValueAtTime(freq, now + i * stepDuration);

        const startTime = now + i * stepDuration;
        const endTime = startTime + 0.12;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.35, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, endTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(endTime);
      });
    }

    // Lower-pitch chime for rest phase
    function playRestSound() {
      if (!document.getElementById('sound-enabled').checked) return;
      initAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const notes = [523.25, 392.00]; // C5 -> G4
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.12);

        const startTime = now + i * 0.12;
        const endTime = startTime + 0.2;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.25, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, endTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(endTime);
      });
    }

    // Crisp short beep for countdown ticks
    function playTickSound() {
      if (!document.getElementById('sound-enabled').checked) return;
      initAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now); // A5

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.05);
    }

    // --- Workout Timer Logic ---
    let timer = null;
    let currentPhase = 'IDLE'; // PREP, WORK, REST, IDLE
    let currentCycle = 1;
    let totalCycles = 3;
    let timeLeft = 0;
    let isPaused = false;

    // DOM Elements
    const prepInput = document.getElementById('prep-time');
    const workInput = document.getElementById('work-time');
    const restInput = document.getElementById('rest-time');
    const cyclesInput = document.getElementById('cycles');

    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');

    const phaseBadge = document.getElementById('phase-badge');
    const exerciseName = document.getElementById('exercise-name');
    const timeDisplay = document.getElementById('time-display');
    const cycleDisplay = document.getElementById('cycle-display');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateBadge(phase) {
      phaseBadge.className = 'phase-badge';
      if (phase === 'PREP') {
        phaseBadge.textContent = 'GET READY';
        phaseBadge.classList.add('phase-prep');
      } else if (phase === 'WORK') {
        phaseBadge.textContent = 'WORK';
        phaseBadge.classList.add('phase-work');
      } else if (phase === 'REST') {
        phaseBadge.textContent = 'REST';
        phaseBadge.classList.add('phase-rest');
      } else {
        phaseBadge.textContent = 'READY';
        phaseBadge.classList.add('phase-prep');
      }
    }

    function startWorkout() {
      initAudioContext();
      totalCycles = parseInt(cyclesInput.value) || 1;
      currentCycle = 1;
      isPaused = false;

      startBtn.disabled = true;
      pauseBtn.disabled = false;

      const prepTime = parseInt(prepInput.value) || 0;
      if (prepTime > 0) {
        switchPhase('PREP', prepTime);
      } else {
        switchPhase('WORK', parseInt(workInput.value) || 30);
      }

      if (timer) clearInterval(timer);
      timer = setInterval(tick, 1000);
    }

    function switchPhase(phase, duration) {
      currentPhase = phase;
      timeLeft = duration;
      updateBadge(phase);
      cycleDisplay.textContent = `Cycle ${currentCycle} / ${totalCycles}`;
      timeDisplay.textContent = formatTime(timeLeft);

      if (phase === 'WORK') {
        exerciseName.textContent = `Exercise ${currentCycle}`;
        playEnthusiasticStartSound(); // Upbeat sound on WORK phase start
      } else if (phase === 'REST') {
        exerciseName.textContent = 'Rest & Recover';
        playRestSound();
      } else if (phase === 'PREP') {
        exerciseName.textContent = 'Prepare for First Set';
      }
    }

    function tick() {
      if (isPaused) return;

      if (timeLeft > 1) {
        timeLeft--;
        timeDisplay.textContent = formatTime(timeLeft);
        if (timeLeft <= 3) {
          playTickSound();
        }
      } else {
        // Phase transition logic
        if (currentPhase === 'PREP') {
          switchPhase('WORK', parseInt(workInput.value) || 30);
        } else if (currentPhase === 'WORK') {
          const restTime = parseInt(restInput.value) || 0;
          if (currentCycle < totalCycles) {
            if (restTime > 0) {
              switchPhase('REST', restTime);
            } else {
              currentCycle++;
              switchPhase('WORK', parseInt(workInput.value) || 30);
            }
          } else {
            completeWorkout();
          }
        } else if (currentPhase === 'REST') {
          currentCycle++;
          switchPhase('WORK', parseInt(workInput.value) || 30);
        }
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
    }

    function resetWorkout() {
      clearInterval(timer);
      timer = null;
      currentPhase = 'IDLE';
      isPaused = false;

      startBtn.disabled = false;
      pauseBtn.disabled = true;
      pauseBtn.textContent = 'Pause';

      updateBadge('IDLE');
      exerciseName.textContent = 'Press Start';
      timeDisplay.textContent = '00:00';
      cycleDisplay.textContent = 'Cycle 0 / 0';
    }

    function completeWorkout() {
      clearInterval(timer);
      timer = null;
      currentPhase = 'IDLE';

      startBtn.disabled = false;
      pauseBtn.disabled = true;

      phaseBadge.textContent = 'FINISHED!';
      phaseBadge.className = 'phase-badge phase-work';
      exerciseName.textContent = 'Great Job!';
      timeDisplay.textContent = '00:00';
      playEnthusiasticStartSound(); // Trigger celebratory chime
    }

    // Event Listeners
    startBtn.addEventListener('click', startWorkout);
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', resetWorkout);

    // Global touch unlocker for iOS Web Audio initialization
    document.addEventListener('touchstart', initAudioContext, { once: true });
    document.addEventListener('click', initAudioContext, { once: true });
  </script>
</body>
</html>
