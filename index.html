<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Interval Timer</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Cartoon Illustration Container */
    .graphic-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .cartoon-box {
      width: 180px;
      height: 180px;
      background-color: var(--card-bg);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 12px;
      position: relative;
    }

    /* SVG Cartoon Animations */
    .figure {
      stroke: var(--text-color);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .anim-work .figure {
      animation: workout-bounce 0.8s infinite alternate ease-in-out;
    }

    .anim-rest .figure {
      animation: rest-breathe 2s infinite alternate ease-in-out;
    }

    @keyframes workout-bounce {
      0% { transform: translateY(0) scaleY(1); }
      100% { transform: translateY(-15px) scaleY(0.95); }
    }

    @keyframes rest-breathe {
      0% { transform: scale(0.98); opacity: 0.7; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .exercise-title {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
    }

    .phase-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.2); color: var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.2); color: var(--accent-rest); }

    /* Timer Display */
    .timer-display {
      text-align: center;
      margin: 10px 0;
    }

    .time-left {
      font-size: 80px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .rounds-count {
      font-size: 16px;
      color: var(--subtext-color);
      margin-top: 8px;
    }

    /* Setup & Controls Screen */
    .controls-card {
      background-color: var(--card-bg);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 24px 24px 36px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .setting-row label {
      font-size: 16px;
      color: var(--subtext-color);
    }

    .setting-row input {
      width: 70px;
      background: #2c2c2e;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: #2c2c2e; color: var(--danger-color); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="appHeader">Interval Trainer</h1>
  </header>

  <div class="graphic-container">
    <div class="cartoon-box" id="cartoonBox">
      <svg width="100" height="100" viewBox="0 0 100 100" class="figure" id="svgFigure">
        <circle cx="50" cy="25" r="10" />
        <line x1="50" y1="35" x2="50" y2="65" />
        <path id="arms" d="M 25 45 L 50 40 L 75 45" />
        <path id="legs" d="M 30 85 L 50 65 L 70 85" />
      </svg>
    </div>

    <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
    <div class="exercise-title" id="exerciseName">Jumping Jacks</div>
  </div>

  <div class="timer-display">
    <div class="time-left" id="timer">00:30</div>
    <div class="rounds-count" id="roundDisplay">Set 1 of 5</div>
  </div>

  <div class="controls-card">
    <div id="setupForm">
      <div class="setting-row">
        <label for="workTime">Work (seconds)</label>
        <input type="number" id="workTime" value="30" min="5">
      </div>
      <div class="setting-row">
        <label for="restTime">Pause (seconds)</label>
        <input type="number" id="restTime" value="10" min="5">
      </div>
      <div class="setting-row">
        <label for="totalRounds">Total Sets</label>
        <input type="number" id="totalRounds" value="5" min="1">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
    </div>
  </div>

  <script>
    // Sample Workout Rotation
    const exercises = [
      { name: "Jumping Jacks", arms: "M 20 25 L 50 40 L 80 25", legs: "M 25 85 L 50 65 L 75 85" },
      { name: "Squats", arms: "M 25 45 L 50 45 L 75 45", legs: "M 30 75 L 50 60 L 70 75" },
      { name: "High Knees", arms: "M 30 40 L 50 50 L 70 40", legs: "M 35 85 L 50 65 L 65 70" },
      { name: "Push-ups", arms: "M 20 55 L 50 50 L 80 55", legs: "M 20 70 L 50 65 L 80 70" }
    ];

    let currentExerciseIndex = 0;
    let isWorkPhase = true;
    let isRunning = false;
    let currentRound = 1;
    let timeRemaining = 0;
    let timerInterval = null;

    // Elements
    const timerEl = document.getElementById('timer');
    const roundDisplayEl = document.getElementById('roundDisplay');
    const exerciseNameEl = document.getElementById('exerciseName');
    const phaseBadgeEl = document.getElementById('phaseBadge');
    const cartoonBoxEl = document.getElementById('cartoonBox');
    const armsEl = document.getElementById('arms');
    const legsEl = document.getElementById('legs');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const setupForm = document.getElementById('setupForm');

    function updateGraphic(exercise, isRest) {
      if (isRest) {
        cartoonBoxEl.className = "cartoon-box anim-rest";
        phaseBadgeEl.className = "phase-badge phase-rest";
        phaseBadgeEl.innerText = "Pause / Rest";
        exerciseNameEl.innerText = "Rest & Recover";
        // Rest Pose
        armsEl.setAttribute("d", "M 30 60 L 50 50 L 70 60");
        legsEl.setAttribute("d", "M 35 85 L 50 65 L 65 85");
      } else {
        cartoonBoxEl.className = "cartoon-box anim-work";
        phaseBadgeEl.className = "phase-badge phase-work";
        phaseBadgeEl.innerText = "Exercise";
        exerciseNameEl.innerText = exercise.name;
        // Exercise Pose
        armsEl.setAttribute("d", exercise.arms);
        legsEl.setAttribute("d", exercise.legs);
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (!isRunning) {
        startWorkout();
      } else {
        pauseWorkout();
      }
    }

    function startWorkout() {
      isRunning = true;
      startBtn.innerText = "Pause";
      startBtn.className = "btn btn-pause";
      resetBtn.classList.remove('hidden');
      setupForm.classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value);
      }

      updateDisplay();

      timerInterval = setInterval(() => {
        timeRemaining--;

        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      startBtn.innerText = "Resume";
      startBtn.className = "btn btn-start";
    }

    function switchPhase() {
      const workSecs = parseInt(document.getElementById('workTime').value);
      const restSecs = parseInt(document.getElementById('restTime').value);
      const totalRounds = parseInt(document.getElementById('totalRounds').value);

      if (isWorkPhase) {
        // Transition to Pause Period
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        // Transition to Next Work Period
        isWorkPhase = true;
        currentRound++;

        if (currentRound > totalRounds) {
          finishWorkout();
          return;
        }

        currentExerciseIndex = (currentExerciseIndex + 1) % exercises.length;
        timeRemaining = workSecs;
      }

      updateDisplay();
    }

    function updateDisplay() {
      timerEl.innerText = formatTime(timeRemaining);
      const totalRounds = document.getElementById('totalRounds').value;
      roundDisplayEl.innerText = `Set ${currentRound} of ${totalRounds}`;
      
      const currentEx = exercises[currentExerciseIndex];
      updateGraphic(currentEx, !isWorkPhase);
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentRound = 1;
      currentExerciseIndex = 0;
      timeRemaining = 0;

      startBtn.innerText = "Start";
      startBtn.className = "btn btn-start";
      resetBtn.classList.add('hidden');
      setupForm.classList.remove('hidden');

      phaseBadgeEl.className = "phase-badge phase-work";
      phaseBadgeEl.innerText = "Ready";
      exerciseNameEl.innerText = exercises[0].name;
      timerEl.innerText = formatTime(parseInt(document.getElementById('workTime').value));
      roundDisplayEl.innerText = `Set 1 of ${document.getElementById('totalRounds').value}`;
      
      cartoonBoxEl.className = "cartoon-box";
      armsEl.setAttribute("d", exercises[0].arms);
      legsEl.setAttribute("d", exercises[0].legs);
    }

    // Initialize UI default state
    resetWorkout();
  </script>
</body>
</html>
