<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dumbbell Workout Timer</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dumbbell Timer">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 250px;
      height: 250px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    .anatomy-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(48, 209, 88, 0.15));
      transition: opacity 0.3s ease;
    }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 16px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .muscle-label {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }

    .time-left {
      font-size: 76px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -2px;
    }

    .rounds-count {
      font-size: 14px;
      color: var(--subtext-color);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label { font-size: 15px; color: var(--subtext-color); }

    .setting-row input {
      width: 70px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 12px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info { display: flex; flex-direction: column; }
    .ex-name { font-size: 16px; font-weight: 600; }
    .ex-target { font-size: 11px; color: var(--subtext-color); text-transform: uppercase; margin-top: 2px; letter-spacing: 0.5px; }
    .ex-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Dumbbell Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <!-- Option B Silhouette Graphic -->
        <img id="exerciseArt" src="" alt="Exercise Anatomy">
      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Bicep Curls</div>
      <div class="muscle-label" id="muscleLabel">Target: BICEPS</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add Dumbbell Exercise</h3>
        
        <input type="text" id="newExName" list="exercisePresets" placeholder="Type or select exercise" oninput="autoDetectConfig()">
        
        <datalist id="exercisePresets">
          <option value="Dumbbell Curls">
          <option value="Hammer Curls">
          <option value="Tricep Extensions">
          <option value="Tricep Kickbacks">
          <option value="Dumbbell Bench Press">
          <option value="Chest Flyes">
          <option value="Single-Arm Rows">
          <option value="Bent-Over Rows">
        </datalist>

        <select id="newExMuscle">
          <option value="biceps">Biceps (Arms)</option>
          <option value="triceps">Triceps (Arms)</option>
          <option value="chest">Chest (Pectorals)</option>
          <option value="back">Back (Lats &amp; Traps)</option>
        </select>

        <select id="newExArt">
          <option value="biceps">Bicep Muscle Map</option>
          <option value="triceps">Triceps Muscle Map</option>
          <option value="chest">Chest Muscle Map</option>
          <option value="back">Back Muscle Map</option>
        </select>

        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    /* OPTION B: FILLED MUSCLE-MAP SILHOUETTES (Start & End Extremes) */
    var silhouetteAssets = {
      biceps: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="35" y="88" width="30" height="4" rx="2" fill="%232c2c2e"/><circle cx="50" cy="22" r="9" fill="%233a3a3c"/><path d="M42 32 C38 36 38 48 40 68 C41 78 39 88 38 88 L62 88 C61 88 59 78 60 68 C62 48 62 36 58 32 Z" fill="%233a3a3c"/><path d="M38 34 C33 40 31 52 33 66 L27 66 C24 52 28 38 34 32 Z" fill="%232c2c2e"/><path d="M62 34 C67 40 69 52 67 66 L73 66 C76 52 72 38 66 32 Z" fill="%232c2c2e"/><path d="M34 42 C32 46 32 54 35 58 C37 54 37 46 34 42 Z" fill="%2330d158"/><path d="M66 42 C68 46 68 54 65 58 C63 54 63 46 66 42 Z" fill="%2330d158"/><rect x="23" y="64" width="8" height="14" rx="3" fill="%238e8e93"/><rect x="69" y="64" width="8" height="14" rx="3" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="35" y="88" width="30" height="4" rx="2" fill="%232c2c2e"/><circle cx="50" cy="22" r="9" fill="%233a3a3c"/><path d="M42 32 C38 36 38 48 40 68 C41 78 39 88 38 88 L62 88 C61 88 59 78 60 68 C62 48 62 36 58 32 Z" fill="%233a3a3c"/><path d="M38 34 C32 38 28 42 26 48 L31 52 C35 44 38 40 40 38 Z" fill="%232c2c2e"/><path d="M62 34 C68 38 72 42 74 48 L69 52 C65 44 62 40 60 38 Z" fill="%232c2c2e"/><path d="M35 38 C31 41 30 46 34 49 C37 45 37 40 35 38 Z" fill="%2330d158"/><path d="M65 38 C69 41 70 46 66 49 C63 45 63 40 65 38 Z" fill="%2330d158"/><rect x="22" y="44" width="10" height="10" rx="3" fill="%238e8e93"/><rect x="68" y="44" width="10" height="10" rx="3" fill="%238e8e93"/></svg>'
      },
      triceps: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="35" y="88" width="30" height="4" rx="2" fill="%232c2c2e"/><circle cx="50" cy="42" r="9" fill="%233a3a3c"/><path d="M42 52 L40 88 L60 88 L58 52 Z" fill="%233a3a3c"/><path d="M42 52 C40 38 42 28 43 20 L49 20 C47 28 46 38 45 52 Z" fill="%232c2c2e"/><path d="M58 52 C60 38 58 28 57 20 L51 20 C53 28 54 38 55 52 Z" fill="%232c2c2e"/><path d="M40 20 C36 28 34 32 38 36 L43 28 Z" fill="%232c2c2e"/><path d="M60 20 C64 28 66 32 62 36 L57 28 Z" fill="%232c2c2e"/><path d="M41 28 C38 34 39 42 43 48 C43 40 43 32 41 28 Z" fill="%2330d158"/><path d="M59 28 C62 34 61 42 57 48 C57 40 57 32 59 28 Z" fill="%2330d158"/><rect x="32" y="32" width="12" height="8" rx="2" fill="%238e8e93"/><rect x="56" y="32" width="12" height="8" rx="2" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="35" y="88" width="30" height="4" rx="2" fill="%232c2c2e"/><circle cx="50" cy="42" r="9" fill="%233a3a3c"/><path d="M42 52 L40 88 L60 88 L58 52 Z" fill="%233a3a3c"/><path d="M42 52 C40 38 42 26 44 12 L49 12 C47 26 46 38 45 52 Z" fill="%232c2c2e"/><path d="M58 52 C60 38 58 26 56 12 L51 12 C53 26 54 38 55 52 Z" fill="%232c2c2e"/><path d="M41 26 C39 34 40 42 44 48 C43 40 43 32 41 26 Z" fill="%2330d158"/><path d="M59 26 C61 34 60 42 56 48 C57 40 57 32 59 26 Z" fill="%2330d158"/><rect x="42" y="6" width="16" height="8" rx="2" fill="%238e8e93"/></svg>'
      },
      chest: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="15" y="62" width="70" height="6" rx="3" fill="%232c2c2e"/><rect x="25" y="68" width="6" height="18" fill="%232c2c2e"/><rect x="69" y="68" width="6" height="18" fill="%232c2c2e"/><circle cx="28" cy="56" r="8" fill="%233a3a3c"/><path d="M36 54 L75 54 L70 62 L36 62 Z" fill="%233a3a3c"/><path d="M44 54 C44 46 48 42 40 40 L34 48 Z" fill="%232c2c2e"/><path d="M56 54 C56 46 52 42 60 40 L66 48 Z" fill="%232c2c2e"/><path d="M42 54 C46 50 50 50 50 54 Z" fill="%2330d158"/><path d="M58 54 C54 50 50 50 50 54 Z" fill="%2330d158"/><rect x="28" y="36" width="12" height="7" rx="2" fill="%238e8e93"/><rect x="60" y="36" width="12" height="7" rx="2" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="15" y="62" width="70" height="6" rx="3" fill="%232c2c2e"/><rect x="25" y="68" width="6" height="18" fill="%232c2c2e"/><rect x="69" y="68" width="6" height="18" fill="%232c2c2e"/><circle cx="28" cy="56" r="8" fill="%233a3a3c"/><path d="M36 54 L75 54 L70 62 L36 62 Z" fill="%233a3a3c"/><path d="M44 54 C44 42 46 32 44 22 L48 22 C50 32 48 42 46 54 Z" fill="%232c2c2e"/><path d="M56 54 C56 42 54 32 56 22 L52 22 C50 32 52 42 54 54 Z" fill="%232c2c2e"/><path d="M42 54 C46 48 50 48 50 54 Z" fill="%2330d158"/><path d="M58 54 C54 48 50 48 50 54 Z" fill="%2330d158"/><rect x="40" y="16" width="20" height="8" rx="2" fill="%238e8e93"/></svg>'
      },
      back: {
        start: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="20" y="72" width="60" height="5" rx="2" fill="%232c2c2e"/><rect x="30" y="77" width="5" height="15" fill="%232c2c2e"/><circle cx="72" cy="36" r="8" fill="%233a3a3c"/><path d="M66 40 L40 50 L32 72 L42 72 L48 56 L64 46 Z" fill="%233a3a3c"/><path d="M56 44 C50 48 46 56 44 70 L50 70 C52 58 56 52 60 46 Z" fill="%232c2c2e"/><path d="M54 44 C48 46 42 46 48 52 Z" fill="%2330d158"/><rect x="38" y="66" width="12" height="8" rx="2" fill="%238e8e93"/></svg>',
        end: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect x="20" y="72" width="60" height="5" rx="2" fill="%232c2c2e"/><rect x="30" y="77" width="5" height="15" fill="%232c2c2e"/><circle cx="72" cy="36" r="8" fill="%233a3a3c"/><path d="M66 40 L40 50 L32 72 L42 72 L48 56 L64 46 Z" fill="%233a3a3c"/><path d="M56 44 C52 42 48 38 46 34 L52 34 C54 38 56 40 58 42 Z" fill="%232c2c2e"/><path d="M54 44 C48 46 42 44 48 40 Z" fill="%2330d158"/><rect x="42" y="30" width="12" height="8" rx="2" fill="%238e8e93"/></svg>'
      }
    };

    var exerciseLibrary = {
      "dumbbell curls": { muscle: "biceps", artKey: "biceps" },
      "bicep curls": { muscle: "biceps", artKey: "biceps" },
      "tricep extensions": { muscle: "triceps", artKey: "triceps" },
      "triceps extension": { muscle: "triceps", artKey: "triceps" },
      "dumbbell bench press": { muscle: "chest", artKey: "chest" },
      "chest press": { muscle: "chest", artKey: "chest" },
      "single-arm rows": { muscle: "back", artKey: "back" }
    };

    var defaultExercises = [
      { id: 1, name: "Dumbbell Curls", muscle: "biceps", artKey: "biceps" },
      { id: 2, name: "Tricep Extensions", muscle: "triceps", artKey: "triceps" },
      { id: 3, name: "Dumbbell Bench Press", muscle: "chest", artKey: "chest" },
      { id: 4, name: "Single-Arm Rows", muscle: "back", artKey: "back" }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_dumbbell_timer_optB');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;
    var animationInterval = null;
    var isEndPosition = false;

    function startAnimation() {
      stopAnimation();
      animationInterval = setInterval(function() {
        if (isRunning && isWorkPhase) {
          isEndPosition = !isEndPosition;
        } else {
          isEndPosition = false;
        }
        updateArtDisplay();
      }, 1200); // Smooth 1.2s cadence between extreme positions
    }

    function stopAnimation() {
      if (animationInterval) clearInterval(animationInterval);
    }

    function updateArtDisplay() {
      var artImg = document.getElementById('exerciseArt');
      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      var artKey = currentEx.artKey || 'biceps';
      var set = silhouetteAssets[artKey] || silhouetteAssets.biceps;

      if (!isWorkPhase) {
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        var nextArtKey = nextEx ? nextEx.artKey : 'biceps';
        set = silhouetteAssets[nextArtKey] || silhouetteAssets.biceps;
        artImg.src = set.start;
      } else {
        artImg.src = isEndPosition ? set.end : set.start;
      }
    }

    function autoDetectConfig() {
      var nameVal = document.getElementById('newExName').value.trim().toLowerCase();
      if (exerciseLibrary[nameVal]) {
        var match = exerciseLibrary[nameVal];
        document.getElementById('newExMuscle').value = match.muscle;
        document.getElementById('newExArt').value = match.artKey;
      }
    }

    function saveExercises() {
      try {
        localStorage.setItem('ios_dumbbell_timer_optB', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Dumbbell Timer";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();
      startAnimation();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      isEndPosition = false;
      updateDisplay();
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      isEndPosition = false;
      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || defaultExercises[0];
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work Phase";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "UPPER BODY");
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest Phase";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");
      }

      updateArtDisplay();
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      stopAnimation();
      isRunning = false;
      isWorkPhase = true;
      isEndPosition = false;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var name = nameInput.value.trim();

      if (!name) return;

      var muscleSelect = document.getElementById('newExMuscle').value;
      var artSelect = document.getElementById('newExArt').value;

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: muscleSelect,
        artKey: artSelect
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Initialize App State
    resetWorkout();
  </script>
</body>
</html>
