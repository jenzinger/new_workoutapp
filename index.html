<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dumbbell Workout Timer - Dynamic Edition</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dumbbell Timer">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 280px;
      height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .anatomy-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    .exercise-title {
      font-size: 24px;
      font-weight: 700;
      margin-top: 16px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }

    .time-left {
      font-size: 76px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -2px;
    }

    .rounds-count {
      font-size: 14px;
      color: var(--subtext-color);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label { font-size: 15px; color: var(--subtext-color); }

    .setting-row input {
      width: 70px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }

    .manager-content { padding: 20px; flex: 1; overflow-y: auto; }

    .search-box {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .search-results {
      max-height: 200px;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .search-item {
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background-color: var(--card-inner); }

    .ex-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .icon-btn { background: none; border: none; color: var(--subtext-color); font-size: 18px; padding: 6px; cursor: pointer; }
    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Dumbbell Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Search Dataset</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <img id="exerciseArt" src="" alt="Exercise Frame" onerror="handleImageError(this)">
      </div>
      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Loading...</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 1</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <h3>Search Dataset Exercises</h3>
      <br>
      <input type="text" id="searchInput" class="search-box" placeholder="Type exercise name..." oninput="filterDataset()">
      
      <div class="search-results" id="searchResults"></div>

      <h3>Active Routine &amp; Order</h3>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    const CDN_BASE = "https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@main/";
    const JSON_URL = `${CDN_BASE}data/exercises.json`;

    let dataset = [];
    let exercises = [];

    let currentExerciseIndex = 0;
    let isWorkPhase = true;
    let isRunning = false;
    let timeRemaining = 30;
    let timerInterval = null;
    let animationInterval = null;
    let isFrameOne = false;

    async function initApp() {
      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const rawData = await response.json();
        
        // Normalize dataset structure
        dataset = rawData.map(item => ({
          name: item.name || item.title || "Exercise",
          image: item.image || (item.images && item.images[0]) || "",
          images: item.images || [item.image]
        })).filter(item => item.image);

        // Load routine from localStorage or pick initial presets
        const saved = localStorage.getItem('dynamic_timer_routine');
        if (saved) {
          exercises = JSON.parse(saved);
        } else if (dataset.length > 0) {
          exercises = dataset.slice(0, 3);
        }

        resetWorkout();
      } catch (err) {
        console.error("Dataset fetch failed:", err);
        document.getElementById('exerciseName').innerText = "Failed to load dataset";
      }
    }

    function getImageUrl(item, frameIdx) {
      if (!item) return '';
      let imgPath = item.images && item.images[frameIdx] ? item.images[frameIdx] : item.image;
      if (imgPath.startsWith('http')) return imgPath;
      return `${CDN_BASE}${imgPath}`;
    }

    function handleImageError(imgEl) {
      imgEl.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280' viewBox='0 0 280 280'><rect width='280' height='280' fill='%231c1c1e'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%238e8e93' font-family='sans-serif' font-size='14'>Image Unavailable</text></svg>";
    }

    function startAnimation() {
      stopAnimation();
      animationInterval = setInterval(() => {
        if (isRunning && isWorkPhase) {
          isFrameOne = !isFrameOne;
        } else {
          isFrameOne = false;
        }
        updateArtDisplay();
      }, 1000);
    }

    function stopAnimation() {
      if (animationInterval) clearInterval(animationInterval);
    }

    function updateArtDisplay() {
      const artImg = document.getElementById('exerciseArt');
      const currentEx = exercises[currentExerciseIndex] || dataset[0];
      const frameIdx = isFrameOne ? 1 : 0;
      if (currentEx) {
        artImg.src = getImageUrl(currentEx, frameIdx);
      }
    }

    function filterDataset() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!query) return;

      const filtered = dataset.filter(ex => ex.name.toLowerCase().includes(query)).slice(0, 15);
      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `<span>${ex.name}</span><button class="nav-btn">+ Add</button>`;
        item.onclick = () => addFromDataset(ex);
        resultsContainer.appendChild(item);
      });
    }

    function addFromDataset(ex) {
      exercises.push({
        id: Date.now(),
        name: ex.name,
        image: ex.image,
        images: ex.images
      });
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
      saveExercises();
    }

    function saveExercises() {
      try {
        localStorage.setItem('dynamic_timer_routine', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      const timerView = document.getElementById('timerView');
      const managerView = document.getElementById('managerView');
      const toggleBtn = document.getElementById('toggleViewBtn');
      const title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Search Dataset";
        title.innerText = "Dumbbell Timer";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (exercises.length === 0) return alert("Please add an exercise first.");
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();
      startAnimation();

      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      isFrameOne = false;
      updateDisplay();
    }

    function switchPhase() {
      const workSecs = parseInt(document.getElementById('workTime').value) || 30;
      const restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex = (currentExerciseIndex + 1) % exercises.length;
        timeRemaining = workSecs;
      }

      isFrameOne = false;
      updateDisplay();
    }

    function updateDisplay() {
      if (exercises.length === 0) return;
      const currentEx = exercises[currentExerciseIndex] || dataset[0];
      const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
      const secs = String(timeRemaining % 60).padStart(2, '0');
      
      document.getElementById('timer').innerText = `${mins}:${secs}`;
      document.getElementById('roundDisplay').innerText = `Exercise ${currentExerciseIndex + 1} of ${exercises.length}`;

      const phaseBadge = document.getElementById('phaseBadge');
      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work";
        document.getElementById('exerciseName').innerText = currentEx ? currentEx.name : "";
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest";
        document.getElementById('exerciseName').innerText = "Rest Phase";
      }
      updateArtDisplay();
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      stopAnimation();
      isRunning = false;
      isWorkPhase = true;
      isFrameOne = false;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function renderManagerList() {
      const listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';
      exercises.forEach((ex, idx) => {
        const li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = `
          <span>${ex.name}</span>
          <div class="ex-actions">
            <button class="icon-btn" onclick="moveExercise(${idx}, -1)">▲</button>
            <button class="icon-btn" onclick="moveExercise(${idx}, 1)">▼</button>
            <button class="icon-btn delete" onclick="deleteEx(${idx})">✕</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function deleteEx(idx) {
      exercises.splice(idx, 1);
      saveExercises();
    }

    function moveExercise(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;
      const temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;
      saveExercises();
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
