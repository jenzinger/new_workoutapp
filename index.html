<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Anatomical Workout Timer</title>

  <!-- iOS PWA Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --card-inner: #2c2c2e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --muscle-active: #ff3b30;
      --muscle-glow: rgba(255, 59, 48, 0.6);
      --muscle-base: #3a3a3c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid #2c2c2e;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* Anatomical Diagram Area */
    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 240px;
      height: 240px;
      background-color: var(--card-bg);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    /* Vector Frames Switcher */
    .figure-frame {
      display: none;
      width: 160px;
      height: 180px;
      align-items: center;
      justify-content: center;
    }

    .figure-frame.active {
      display: flex;
    }

    .skeleton-base { fill: #2c2c2e; stroke: #48484a; stroke-width: 1.5; }
    .muscle { fill: var(--muscle-base); transition: fill 0.3s ease; }
    .muscle.active {
      fill: var(--muscle-active);
      filter: drop-shadow(0 0 6px var(--muscle-glow));
    }

    /* Motion Animations */
    .anim-jacks #jack-arm-l {
      animation: jack-arm-left 0.7s infinite alternate ease-in-out;
      transform-origin: 32px 32px;
    }
    .anim-jacks #jack-arm-r {
      animation: jack-arm-right 0.7s infinite alternate ease-in-out;
      transform-origin: 68px 32px;
    }
    .anim-jacks #jack-leg-l {
      animation: jack-leg-left 0.7s infinite alternate ease-in-out;
      transform-origin: 42px 75px;
    }
    .anim-jacks #jack-leg-r {
      animation: jack-leg-right 0.7s infinite alternate ease-in-out;
      transform-origin: 58px 75px;
    }

    @keyframes jack-arm-left { 0% { transform: rotate(0deg); } 100% { transform: rotate(-130deg); } }
    @keyframes jack-arm-right { 0% { transform: rotate(0deg); } 100% { transform: rotate(130deg); } }
    @keyframes jack-leg-left { 0% { transform: rotate(0deg); } 100% { transform: rotate(-22deg); } }
    @keyframes jack-leg-right { 0% { transform: rotate(0deg); } 100% { transform: rotate(22deg); } }

    .anim-pushups svg {
      animation: pushup-body 1.1s infinite alternate ease-in-out;
      transform-origin: 85px 85px;
    }
    @keyframes pushup-body { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(22px) rotate(3deg); } }

    .anim-squats #squat-torso {
      animation: squat-hips 1s infinite alternate ease-in-out;
      transform-origin: 50px 100px;
    }
    @keyframes squat-hips { 0% { transform: translateY(0px); } 100% { transform: translateY(28px) scaleY(0.92); } }

    .anim-crunches #crunch-torso {
      animation: crunch-flex 0.9s infinite alternate ease-in-out;
      transform-origin: 50px 65px;
    }
    @keyframes crunch-flex { 0% { transform: rotate(0deg); } 100% { transform: rotate(-22deg); } }

    .anim-rest { animation: rest-pulse 2.5s infinite alternate ease-in-out; }
    @keyframes rest-pulse { 0% { transform: scale(0.97); opacity: 0.85; } 100% { transform: scale(1.02); opacity: 1; } }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 14px;
      text-align: center;
    }

    .muscle-label {
      font-size: 13px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.2); color: var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.2); color: var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }

    .time-left {
      font-size: 72px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .rounds-count {
      font-size: 15px;
      color: var(--subtext-color);
      margin-top: 6px;
    }

    .controls-card {
      background-color: var(--card-bg);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label { font-size: 15px; color: var(--subtext-color); }

    .setting-row input {
      width: 65px;
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 12px; }

    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      width: 100%;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info { display: flex; flex-direction: column; }
    .ex-name { font-size: 16px; font-weight: 600; }
    .ex-target { font-size: 12px; color: var(--subtext-color); text-transform: uppercase; margin-top: 2px; }
    .ex-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Workout Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">

        <!-- FRAME 1: Standing / Jumping Jacks -->
        <div class="figure-frame active" id="frame-standing">
          <svg width="120" height="160" viewBox="0 0 100 140">
            <circle cx="50" cy="16" r="8" class="skeleton-base" />
            <path d="M 42 26 L 58 26 L 54 75 L 46 75 Z" class="skeleton-base" />
            <path id="m-abs-standing" class="muscle" d="M 44 38 L 56 38 L 54 68 L 46 68 Z" />

            <g id="jack-arm-l">
              <path d="M 38 28 L 24 58" class="skeleton-base" stroke-width="4" stroke="#2c2c2e" />
              <path id="m-shoulders-l1" class="muscle" d="M 34 26 C 30 28 32 36 36 36 Z" />
              <path id="m-arms-l1" class="muscle" d="M 33 34 L 25 54 L 29 55 L 36 36 Z" />
            </g>

            <g id="jack-arm-r">
              <path d="M 62 28 L 76 58" class="skeleton-base" stroke-width="4" stroke="#2c2c2e" />
              <path id="m-shoulders-r1" class="muscle" d="M 66 26 C 70 28 68 36 64 36 Z" />
              <path id="m-arms-r1" class="muscle" d="M 67 34 L 75 54 L 71 55 L 64 36 Z" />
            </g>

            <g id="jack-leg-l">
              <path d="M 45 75 L 38 130" class="skeleton-base" stroke-width="5" stroke="#2c2c2e" />
              <path id="m-legs-l1" class="muscle" d="M 46 75 L 38 110 L 44 110 L 49 75 Z" />
            </g>

            <g id="jack-leg-r">
              <path d="M 55 75 L 62 130" class="skeleton-base" stroke-width="5" stroke="#2c2c2e" />
              <path id="m-legs-r1" class="muscle" d="M 54 75 L 62 110 L 56 110 L 51 75 Z" />
            </g>
          </svg>
        </div>

        <!-- FRAME 2: Push-ups Horizontal -->
        <div class="figure-frame" id="frame-pushup">
          <svg width="150" height="120" viewBox="0 0 120 100">
            <circle cx="22" cy="45" r="7" class="skeleton-base" />
            <path d="M 28 48 L 95 55" class="skeleton-base" stroke-width="8" stroke="#2c2c2e" />

            <path id="m-chest-pushup" class="muscle" d="M 32 45 L 48 46 L 46 56 L 32 54 Z" />
            <path id="m-arms-pushup" class="muscle" d="M 32 50 L 40 75 L 45 75 L 38 50 Z" />
            <path id="m-abs-pushup" class="muscle" d="M 50 47 L 75 50 L 73 57 L 48 55 Z" />

            <path d="M 34 50 L 34 78 L 44 78" class="skeleton-base" stroke-width="3" fill="none" stroke="#48484a" />
            <line x1="10" y1="78" x2="110" y2="78" stroke="#3a3a3c" stroke-width="2" />
          </svg>
        </div>

        <!-- FRAME 3: Squat Posture -->
        <div class="figure-frame" id="frame-squat">
          <svg width="120" height="160" viewBox="0 0 100 140">
            <path d="M 38 100 L 38 130 M 62 100 L 62 130" stroke="#2c2c2e" stroke-width="6" stroke-linecap="round" />
            <g id="squat-torso">
              <circle cx="50" cy="20" r="8" class="skeleton-base" />
              <path d="M 44 28 L 56 28 L 54 70 L 46 70 Z" class="skeleton-base" />
              <path id="m-legs-squat" class="muscle" d="M 45 70 L 32 100 L 42 100 L 50 70 Z M 55 70 L 68 100 L 58 100 L 50 70 Z" />
            </g>
          </svg>
        </div>

        <!-- FRAME 4: Crunches Posture -->
        <div class="figure-frame" id="frame-crunch">
          <svg width="150" height="120" viewBox="0 0 120 100">
            <line x1="10" y1="80" x2="110" y2="80" stroke="#3a3a3c" stroke-width="2" />
            <path d="M 65 80 L 85 55 L 100 80" stroke="#2c2c2e" stroke-width="6" fill="none" stroke-linecap="round" />

            <g id="crunch-torso">
              <circle cx="25" cy="55" r="7" class="skeleton-base" />
              <path d="M 30 60 L 65 80" stroke="#2c2c2e" stroke-width="8" stroke-linecap="round" />
              <path id="m-abs-crunch" class="muscle" d="M 34 58 L 60 74 L 56 80 L 32 64 Z" />
            </g>
          </svg>
        </div>

      </div>

      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Jumping Jacks</div>
      <div class="muscle-label" id="muscleLabel">Target: LEGS &amp; CALVES</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 4</div>
    </div>

    <div class="controls-card">
      <div id="setupForm">
        <div class="setting-row">
          <label for="workTime">Work Duration (s)</label>
          <input type="number" id="workTime" value="30" min="5">
        </div>
        <div class="setting-row">
          <label for="restTime">Pause Duration (s)</label>
          <input type="number" id="restTime" value="10" min="5">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <div class="add-form">
        <h3>Add New Exercise</h3>
        
        <!-- Preformed Datalist Auto-Complete & Custom Text Entry -->
        <input type="text" id="newExName" list="exercisePresets" placeholder="Type or select exercise (e.g. Burpees)" oninput="autoDetectConfig()">
        
        <datalist id="exercisePresets">
          <option value="Jumping Jacks">
          <option value="Push-ups">
          <option value="Squats">
          <option value="Crunches">
          <option value="Plank">
          <option value="Lunges">
          <option value="Burpees">
          <option value="Mountain Climbers">
          <option value="High Knees">
          <option value="Dips">
          <option value="Leg Raises">
        </datalist>

        <select id="newExMuscle">
          <option value="legs">Legs (Quads &amp; Calves)</option>
          <option value="chest">Chest (Pectorals)</option>
          <option value="abs">Core / Abs</option>
          <option value="arms">Arms (Biceps &amp; Triceps)</option>
          <option value="shoulders">Shoulders (Deltoids)</option>
          <option value="back">Back (Lats &amp; Traps)</option>
        </select>

        <select id="newExAnimation">
          <option value="anim-jacks">Standing / Jacks Motion</option>
          <option value="anim-pushups">Push-up Motion</option>
          <option value="anim-squats">Squat Motion</option>
          <option value="anim-crunches">Crunch / Flexion Motion</option>
        </select>

        <button class="btn btn-add" onclick="addExercise()">Add to Routine</button>
      </div>

      <h3>Current Routine &amp; Order</h3>
      <br>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    // Presets catalog matching names to targeted animation frames & muscles
    var exerciseDictionary = {
      "jumping jacks": { muscle: "legs", frame: "frame-standing", anim: "anim-jacks" },
      "high knees": { muscle: "legs", frame: "frame-standing", anim: "anim-jacks" },
      "lunges": { muscle: "legs", frame: "frame-squat", anim: "anim-squats" },
      "squats": { muscle: "legs", frame: "frame-squat", anim: "anim-squats" },
      "push-ups": { muscle: "chest", frame: "frame-pushup", anim: "anim-pushups" },
      "pushups": { muscle: "chest", frame: "frame-pushup", anim: "anim-pushups" },
      "dips": { muscle: "arms", frame: "frame-pushup", anim: "anim-pushups" },
      "crunches": { muscle: "abs", frame: "frame-crunch", anim: "anim-crunches" },
      "sit-ups": { muscle: "abs", frame: "frame-crunch", anim: "anim-crunches" },
      "leg raises": { muscle: "abs", frame: "frame-crunch", anim: "anim-crunches" },
      "plank": { muscle: "abs", frame: "frame-pushup", anim: "anim-pushups" },
      "mountain climbers": { muscle: "abs", frame: "frame-pushup", anim: "anim-pushups" },
      "burpees": { muscle: "legs", frame: "frame-standing", anim: "anim-jacks" }
    };

    var defaultExercises = [
      { id: 1, name: "Jumping Jacks", muscle: "legs", frame: "frame-standing", anim: "anim-jacks" },
      { id: 2, name: "Push-ups", muscle: "chest", frame: "frame-pushup", anim: "anim-pushups" },
      { id: 3, name: "Crunches", muscle: "abs", frame: "frame-crunch", anim: "anim-crunches" },
      { id: 4, name: "Squats", muscle: "legs", frame: "frame-squat", anim: "anim-squats" }
    ];

    var exercises = defaultExercises;
    try {
      var saved = localStorage.getItem('ios_workout_exercises_v4');
      if (saved) exercises = JSON.parse(saved);
    } catch (e) {
      exercises = defaultExercises;
    }

    var currentExerciseIndex = 0;
    var isWorkPhase = true;
    var isRunning = false;
    var timeRemaining = 0;
    var timerInterval = null;

    function autoDetectConfig() {
      var nameVal = document.getElementById('newExName').value.trim().toLowerCase();
      if (exerciseDictionary[nameVal]) {
        var match = exerciseDictionary[nameVal];
        document.getElementById('newExMuscle').value = match.muscle;
        document.getElementById('newExAnimation').value = match.anim;
      }
    }

    function saveExercises() {
      try {
        localStorage.setItem('ios_workout_exercises_v4', JSON.stringify(exercises));
      } catch (e) {}
      renderManagerList();
      if (!isRunning) resetWorkout();
    }

    function toggleView() {
      var timerView = document.getElementById('timerView');
      var managerView = document.getElementById('managerView');
      var toggleBtn = document.getElementById('toggleViewBtn');
      var title = document.getElementById('headerTitle');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        title.innerText = "Edit Routine";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Manage Exercises";
        title.innerText = "Workout Timer";
        resetWorkout();
      }
    }

    function renderFrameAndMuscle(frameId, targetMuscle, isAnimActive, animClass) {
      var frames = document.querySelectorAll('.figure-frame');
      frames.forEach(function(f) {
        f.classList.remove('active');
        f.className = 'figure-frame';
      });

      var activeFrame = document.getElementById(frameId) || document.getElementById('frame-standing');
      activeFrame.classList.add('active');

      if (isAnimActive && animClass) {
        activeFrame.classList.add(animClass);
      } else {
        activeFrame.classList.add('anim-rest');
      }

      var muscles = document.querySelectorAll('.muscle');
      muscles.forEach(function(m) { m.classList.remove('active'); });

      if (targetMuscle === 'chest') {
        var el = document.getElementById('m-chest-pushup');
        if (el) el.classList.add('active');
      } else if (targetMuscle === 'abs') {
        ['m-abs-standing', 'm-abs-pushup', 'm-abs-crunch'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.classList.add('active');
        });
      } else if (targetMuscle === 'legs') {
        ['m-legs-l1', 'm-legs-r1', 'm-legs-squat'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.classList.add('active');
        });
      } else if (targetMuscle === 'arms') {
        ['m-arms-l1', 'm-arms-r1', 'm-arms-pushup'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.classList.add('active');
        });
      } else if (targetMuscle === 'shoulders') {
        ['m-shoulders-l1', 'm-shoulders-r1'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.classList.add('active');
        });
      }
    }

    function toggleTimer() {
      if (!exercises || exercises.length === 0) {
        alert("Please add at least one exercise first.");
        return;
      }
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');
      document.getElementById('setupForm').classList.add('hidden');

      if (timeRemaining === 0) {
        timeRemaining = parseInt(document.getElementById('workTime').value) || 30;
      }

      updateDisplay();

      timerInterval = setInterval(function() {
        timeRemaining--;
        if (timeRemaining < 0) {
          switchPhase();
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      updateDisplay();
    }

    function switchPhase() {
      var workSecs = parseInt(document.getElementById('workTime').value) || 30;
      var restSecs = parseInt(document.getElementById('restTime').value) || 10;

      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = restSecs;
      } else {
        isWorkPhase = true;
        currentExerciseIndex++;
        if (currentExerciseIndex >= exercises.length) {
          currentExerciseIndex = 0;
        }
        timeRemaining = workSecs;
      }

      updateDisplay();
    }

    function updateDisplay() {
      var currentEx = exercises[currentExerciseIndex] || { name: "None", muscle: "none", frame: "frame-standing", anim: "" };
      document.getElementById('timer').innerText = formatTime(timeRemaining);
      document.getElementById('roundDisplay').innerText = "Exercise " + (currentExerciseIndex + 1) + " of " + exercises.length;

      var phaseBadge = document.getElementById('phaseBadge');
      var exTitle = document.getElementById('exerciseName');
      var muscleLabel = document.getElementById('muscleLabel');

      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Exercise";
        exTitle.innerText = currentEx.name;
        muscleLabel.innerText = "Target: " + (currentEx.muscle ? currentEx.muscle.toUpperCase() : "GENERAL");
        
        renderFrameAndMuscle(currentEx.frame || 'frame-standing', currentEx.muscle, isRunning, currentEx.anim);
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Pause / Rest";
        exTitle.innerText = "Rest & Prepare";
        var nextEx = exercises[(currentExerciseIndex + 1) % exercises.length];
        muscleLabel.innerText = "Next up: " + (nextEx ? nextEx.name : "Finish");
        
        renderFrameAndMuscle('frame-standing', 'none', false, '');
      }
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      timeRemaining = parseInt(document.getElementById('workTime').value) || 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');
      document.getElementById('setupForm').classList.remove('hidden');

      updateDisplay();
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      var mins = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
    }

    function renderManagerList() {
      var listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';

      exercises.forEach(function(ex, idx) {
        var li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = 
          '<div class="ex-info">' +
            '<span class="ex-name">' + ex.name + '</span>' +
            '<span class="ex-target">' + ex.muscle + '</span>' +
          '</div>' +
          '<div class="ex-actions">' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', -1)">▲</button>' +
            '<button class="icon-btn" onclick="moveExercise(' + idx + ', 1)">▼</button>' +
            '<button class="icon-btn delete" onclick="deleteExercise(' + ex.id + ')">✕</button>' +
          '</div>';
        listEl.appendChild(li);
      });
    }

    function addExercise() {
      var nameInput = document.getElementById('newExName');
      var name = nameInput.value.trim();

      if (!name) return;

      var muscleSelect = document.getElementById('newExMuscle').value;
      var animSelect = document.getElementById('newExAnimation').value;
      var frame = "frame-standing";

      if (animSelect === 'anim-pushups') frame = "frame-pushup";
      else if (animSelect === 'anim-crunches') frame = "frame-crunch";
      else if (animSelect === 'anim-squats') frame = "frame-squat";

      exercises.push({
        id: Date.now(),
        name: name,
        muscle: muscleSelect,
        frame: frame,
        anim: animSelect
      });

      nameInput.value = '';
      saveExercises();
    }

    function deleteExercise(id) {
      exercises = exercises.filter(function(e) { return e.id !== id; });
      saveExercises();
    }

    function moveExercise(index, direction) {
      var newIndex = index + direction;
      if (newIndex < 0 || newIndex >= exercises.length) return;

      var temp = exercises[index];
      exercises[index] = exercises[newIndex];
      exercises[newIndex] = temp;

      saveExercises();
    }

    // Run initial load
    resetWorkout();
  </script>
</body>
</html>
