<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dumbbell Workout Timer - Custom Routine</title>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-inner: #1c1c1e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --border-color: #2c2c2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid var(--border-color);
    }

    header h1 { font-size: 20px; font-weight: 700; }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .view { display: flex; flex-direction: column; flex: 1; justify-content: space-between; }

    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 100%;
      max-width: 340px;
      height: 240px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .anatomy-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }

    .exercise-title { font-size: 24px; font-weight: 700; margin-top: 16px; text-align: center; }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.15); color: var(--accent-work); border: 1px solid var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.15); color: var(--accent-rest); border: 1px solid var(--accent-rest); }

    .timer-display { text-align: center; margin: 8px 0; }
    .time-left { font-size: 76px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .rounds-count { font-size: 14px; color: var(--subtext-color); margin-top: 6px; text-transform: uppercase; }

    .controls-card {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); border: 1px solid var(--border-color); }

    .manager-content { padding: 20px; flex: 1; overflow-y: auto; }

    .search-box {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .search-results {
      max-height: 220px;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .search-item {
      padding: 10px 16px;
      border-bottom: 0.5px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background-color: var(--card-inner); }

    .ex-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

    .ex-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ex-thumb {
      width: 48px;
      height: 48px;
      background-color: #ffffff;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
      padding: 2px;
    }

    .ex-info {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
    }

    .ex-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn { background: none; border: none; color: var(--subtext-color); font-size: 16px; padding: 6px; cursor: pointer; }
    .icon-btn:hover { color: var(--text-color); }
    .icon-btn.delete { color: var(--danger-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Workout Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Search Dataset</button>
  </header>

  <div id="timerView" class="view">
    <div class="diagram-container">
      <div class="anatomy-card">
        <img id="exerciseArt" src="" alt="Exercise Animation">
      </div>
      <div id="phaseBadge" class="phase-badge phase-work">Ready</div>
      <div class="exercise-title" id="exerciseName">Standing Bicep Curl</div>
    </div>

    <div class="timer-display">
      <div class="time-left" id="timer">00:30</div>
      <div class="rounds-count" id="roundDisplay">Exercise 1 of 7</div>
    </div>

    <div class="controls-card">
      <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-reset hidden" id="resetBtn" onclick="resetWorkout()">Reset</button>
      </div>
    </div>
  </div>

  <div id="managerView" class="view hidden">
    <div class="manager-content">
      <h3>Search Dataset Exercises</h3>
      <br>
      <input type="text" id="searchInput" class="search-box" placeholder="Type exercise name (e.g. Curl, Press, Row)..." oninput="filterDataset()">
      
      <div class="search-results" id="searchResults"></div>

      <h3>Your Active Routine</h3>
      <ul class="ex-list" id="exerciseList"></ul>
    </div>
  </div>

  <script>
    const dataset = [
      { name: "Standing Bicep Curl with Supination", src: "./GIFs/Dumbbell-Standing-Inner-Biceps-Curl.gif" },
      { name: "Dumbbell Bent-Over Row", src: "./GIFs/Dumbbell-Bent-Over-Row.gif" },
      { name: "Dumbbell Chest Press", src: "./GIFs/Dumbbell-Chest-Press.gif" },
      { name: "Dumbbell Overhead Shoulder Press", src: "./GIFs/Overhead press.gif" },
      { name: "Lying Dumbbell Skull Crusher", src: "./GIFs/Dumbbell-Skull-Crusher.gif" },
      { name: "Dumbbell Glute Bridge", src: "./GIFs/Glute bridge.gif" },
      { name: "Abdominal Crunch", src: "./GIFs/Crunshes.gif" }
    ];

    let exercises = [...dataset];

    let currentExerciseIndex = 0;
    let isWorkPhase = true;
    let isRunning = false;
    let timeRemaining = 30;
    let timerInterval = null;

    function updateArtDisplay() {
      const artImg = document.getElementById('exerciseArt');
      const currentEx = exercises[currentExerciseIndex] || dataset[0];
      
      if (currentEx) {
        artImg.onerror = function() {
          if (!this.dataset.retry) {
            this.dataset.retry = "true";
            this.src = encodeURI(currentEx.src) + '?t=' + Date.now();
          }
        };
        artImg.dataset.retry = "";
        // Adding a timestamp parameter forces animated GIFs to restart playing upon transition
        artImg.src = currentEx.src + '?t=' + Date.now();
        artImg.alt = currentEx.name;
      }
    }

    function filterDataset() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!query) return;

      const filtered = dataset.filter(ex => ex.name.toLowerCase().includes(query));
      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `
          <img class="ex-thumb" src="${ex.src}" alt="${ex.name}">
          <span style="flex:1;">${ex.name}</span>
          <button class="nav-btn">+ Add</button>
        `;
        item.onclick = () => addFromDataset(ex);
        resultsContainer.appendChild(item);
      });
    }

    function addFromDataset(ex) {
      exercises.push(ex);
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
      renderManagerList();
      updateDisplay();
    }

    function toggleView() {
      const timerView = document.getElementById('timerView');
      const managerView = document.getElementById('managerView');
      const toggleBtn = document.getElementById('toggleViewBtn');

      if (managerView.classList.contains('hidden')) {
        pauseWorkout();
        timerView.classList.add('hidden');
        managerView.classList.remove('hidden');
        toggleBtn.innerText = "Done";
        renderManagerList();
      } else {
        managerView.classList.add('hidden');
        timerView.classList.remove('hidden');
        toggleBtn.innerText = "Search Dataset";
        resetWorkout();
      }
    }

    function toggleTimer() {
      if (exercises.length === 0) return alert("Please add an exercise first.");
      if (!isRunning) startWorkout();
      else pauseWorkout();
    }

    function startWorkout() {
      isRunning = true;
      document.getElementById('startBtn').innerText = "Pause";
      document.getElementById('startBtn').className = "btn btn-pause";
      document.getElementById('resetBtn').classList.remove('hidden');

      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining < 0) switchPhase();
        else updateDisplay();
      }, 1000);
    }

    function pauseWorkout() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = "Resume";
      document.getElementById('startBtn').className = "btn btn-start";
      updateDisplay();
    }

    function switchPhase() {
      if (isWorkPhase) {
        isWorkPhase = false;
        timeRemaining = 10;
      } else {
        isWorkPhase = true;
        currentExerciseIndex = (currentExerciseIndex + 1) % exercises.length;
        timeRemaining = 30;
      }
      updateDisplay();
    }

    function updateDisplay() {
      const currentEx = exercises[currentExerciseIndex] || dataset[0];
      const mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
      const secs = String(timeRemaining % 60).padStart(2, '0');
      
      document.getElementById('timer').innerText = `${mins}:${secs}`;
      document.getElementById('roundDisplay').innerText = `Exercise ${exercises.length > 0 ? currentExerciseIndex + 1 : 0} of ${exercises.length}`;

      const phaseBadge = document.getElementById('phaseBadge');
      if (isWorkPhase) {
        phaseBadge.className = "phase-badge phase-work";
        phaseBadge.innerText = "Work";
        document.getElementById('exerciseName').innerText = currentEx ? currentEx.name : "No Exercise Selected";
      } else {
        phaseBadge.className = "phase-badge phase-rest";
        phaseBadge.innerText = "Rest";
        document.getElementById('exerciseName').innerText = "Rest Phase";
      }
      updateArtDisplay();
    }

    function resetWorkout() {
      clearInterval(timerInterval);
      isRunning = false;
      isWorkPhase = true;
      currentExerciseIndex = 0;
      timeRemaining = 30;

      document.getElementById('startBtn').innerText = "Start";
      document.getElementById('startBtn').className = "btn btn-start";
      document.getElementById('resetBtn').classList.add('hidden');

      updateDisplay();
    }

    function renderManagerList() {
      const listEl = document.getElementById('exerciseList');
      listEl.innerHTML = '';
      exercises.forEach((ex, idx) => {
        const li = document.createElement('li');
        li.className = 'ex-item';
        li.innerHTML = `
          <img class="ex-thumb" src="${ex.src}" alt="${ex.name}">
          <div class="ex-info">${ex.name}</div>
          <div class="ex-actions">
            <button class="icon-btn" onclick="moveEx(${idx}, -1)">▲</button>
            <button class="icon-btn" onclick="moveEx(${idx}, 1)">▼</button>
            <button class="icon-btn delete" onclick="deleteEx(${idx})">✕</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function moveEx(idx, direction) {
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= exercises.length) return;
      const temp = exercises[idx];
      exercises[idx] = exercises[targetIdx];
      exercises[targetIdx] = temp;
      renderManagerList();
      updateDisplay();
    }

    function deleteEx(idx) {
      exercises.splice(idx, 1);
      if (currentExerciseIndex >= exercises.length) {
        currentExerciseIndex = Math.max(0, exercises.length - 1);
      }
      renderManagerList();
      updateDisplay();
    }

    resetWorkout();
  </script>
</body>
</html>
