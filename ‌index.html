<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout Manager Pro</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --card-inner: #2c2c2e;
      --accent-work: #30d158;
      --accent-rest: #0a84ff;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --danger-color: #ff453a;
      --muscle-active: #ff3b30;
      --muscle-base: #48484a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation Bar */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border-bottom: 0.5px solid #2c2c2e;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-rest);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Views Container */
    .view {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* Muscle Diagram Container */
    .diagram-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      flex: 1;
    }

    .anatomy-card {
      width: 220px;
      height: 220px;
      background-color: var(--card-bg);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    /* SVG Muscle Visualization */
    .body-outline { fill: var(--card-inner); stroke: #3a3a3c; stroke-width: 1.5; }
    .muscle { fill: var(--muscle-base); transition: fill 0.3s ease; }
    .muscle.active { fill: var(--muscle-active); filter: drop-shadow(0 0 6px var(--muscle-active)); }

    .exercise-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 14px;
      text-align: center;
    }

    .muscle-label {
      font-size: 13px;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
      font-weight: 600;
    }

    .phase-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .phase-work { background-color: rgba(48, 209, 88, 0.2); color: var(--accent-work); }
    .phase-rest { background-color: rgba(10, 132, 255, 0.2); color: var(--accent-rest); }

    /* Timer Display */
    .timer-display {
      text-align: center;
      margin: 8px 0;
    }

    .time-left {
      font-size: 72px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .rounds-count {
      font-size: 15px;
      color: var(--subtext-color);
      margin-top: 6px;
    }

    /* Controls */
    .controls-card {
      background-color: var(--card-bg);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 20px 24px 32px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-row label {
      font-size: 15px;
      color: var(--subtext-color);
    }

    .setting-row input {
      width: 65px;
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start { background-color: var(--accent-work); color: #000; }
    .btn-pause { background-color: #ff9f0a; color: #000; }
    .btn-reset { background-color: var(--card-inner); color: var(--danger-color); }
    .btn-add { background-color: var(--accent-rest); color: #fff; border-radius: 10px; padding: 10px 16px; }

    /* Exercise List View */
    .manager-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .add-form {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input, .add-form select {
      background: var(--card-inner);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
    }

    .ex-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-item {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info {
      display: flex;
      flex-direction: column;
    }

    .ex-name {
      font-size: 16px;
      font-weight: 600;
    }

    .ex-target {
      font-size: 12px;
      color: var(--subtext-color);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .ex-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .icon-btn.delete { color: var(--danger-color); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">Workout Timer</h1>
    <button class="nav-btn" id="toggleViewBtn" onclick="toggleView()">Manage Exercises</button>
  </header>

  <div id="timerView" class="view">
